; Raises PHP's per-request upload limits for everything under api/, so they
; actually match the app's own business-logic limits defined in
; config/config.php (MAX_IMAGE_SIZE = 10MB, MAX_VIDEO_SIZE = 100MB,
; MAX_DOCUMENT_SIZE = 10MB). Without this, the shared-hosting defaults
; (often as low as 2-8MB) silently cap uploads well below what the app
; advertises as supported.
;
; Only takes effect on PHP-FPM (most cPanel "alt-php" setups). Changes can
; take a few minutes to apply after upload (PHP caches .user.ini for
; user_ini.cache_ttl, default 300s).
upload_max_filesize = 120M
post_max_size = 120M
max_input_time = 300
max_execution_time = 300
memory_limit = 256M
