name: maskedparty
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  videosdk: ^3.10.0
  image_picker: ^1.2.3
  webview_flutter: ^4.10.0
  permission_handler: ^12.0.1
  camera: ^0.11.0+2
  audioplayers: ^6.0.0
  video_compress: ^3.1.4 
  cached_network_image: 3.4.1
  http_parser: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/masked_party.png
    - assets/incoming.mp3
    - assets/outgoing.mp3