<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Page Not Found — Masked Party</title>
<style>
  :root{--primary-pink:#E91E63;--soft-pink:#FF6B8B;--light-pink:#FFE4EC;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:linear-gradient(to bottom,var(--primary-pink),var(--soft-pink),var(--light-pink));text-align:center;padding:24px;}
  .card{background:#fff;border-radius:24px;padding:36px 28px;max-width:360px;box-shadow:0 15px 30px rgba(194,24,91,.25);}
  .mask{font-size:48px;}
  h1{margin-top:12px;font-size:22px;color:#1A1D2E;}
  p{margin-top:8px;font-size:14px;color:#6B7280;}
  a{display:inline-block;margin-top:20px;padding:12px 24px;background:var(--primary-pink);color:#fff;border-radius:12px;text-decoration:none;font-weight:700;font-size:14px;}
</style>
</head>
<body>
  <div class="card">
    <div class="mask" aria-hidden="true">🎭</div>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or may have moved.</p>
    <a href="/">Back to Masked Party</a>
  </div>
</body>
</html>
