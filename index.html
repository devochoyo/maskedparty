<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Masked Party</title>
<style>
  :root{
    --primary-pink:#E91E63;
    --soft-pink:#FF6B8B;
    --light-pink:#FFE4EC;
    --dark-pink:#C2185B;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(to bottom, var(--primary-pink) 0%, var(--soft-pink) 50%, rgba(255,228,236,0.8) 100%);
    overflow:hidden;
  }
  .wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding:24px;
    animation:fadeIn .6s ease-out;
  }
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .logo{
    width:120px;height:120px;border-radius:50%;
    background:#fff;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 15px 30px rgba(194,24,91,0.4);
    font-size:60px;
  }
  h1{
    margin-top:32px;
    font-size:34px;font-weight:700;color:#fff;letter-spacing:-0.8px;
  }
  .tagline{
    margin-top:12px;
    padding:10px 20px;
    background:rgba(255,255,255,0.2);
    border:1px solid rgba(255,255,255,0.3);
    border-radius:20px;
    color:#fff;font-size:15px;font-weight:600;
  }
  .spinner{
    margin-top:48px;
    width:28px;height:28px;
    border:2.5px solid rgba(255,255,255,0.35);
    border-top-color:#fff;
    border-radius:50%;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){
    .wrap{animation:none}
    .spinner{animation-duration:1.6s}
  }
  @media (max-width:360px){
    .logo{width:96px;height:96px;font-size:48px}
    h1{font-size:28px}
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo" aria-hidden="true">🎭</div>
    <h1>MaskedParty</h1>
    <div class="tagline">With or Without the Vail</div>
    <div class="spinner" role="status" aria-label="Loading"></div>
  </div>

<script src="/services/api.js"></script>
<script src="/services/api_endpoints.js"></script>
<script src="/services/session_manager.js"></script>
<script src="/services/auth_service.js"></script>
<script>
  (function () {
    var MIN_SPLASH_MS = 1200;
    var start = Date.now();

    function go(url) {
      var elapsed = Date.now() - start;
      var wait = Math.max(0, MIN_SPLASH_MS - elapsed);
      setTimeout(function () { window.location.replace(url); }, wait);
    }

    (async function resolve() {
      var isLoggedIn = SessionManager.isLoggedIn();
      var role = SessionManager.getRole();
      var token = SessionManager.getToken();

      if (isLoggedIn && token) {
        if ((role || "").toLowerCase() === "influencer") {
          try {
            var result = await AuthService.checkProfileCompletion(token);
            if (result.success === true && result.profile_completed === false) {
              go("/complete-profile");
              return;
            }
          } catch (e) { /* fall through to influencer home */ }
          go("/influencer-home");
        } else {
          go("/client-home");
        }
        return;
      }

      go("/welcome");
    })();
  })();
</script>
</body>
</html>
