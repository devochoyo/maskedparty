<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rate Client — Masked Party</title>
<script src="/widgets/phosphor_icons.js"></script>
<script>PhosphorIcons.load();</script>
<style>
  :root{--primary-pink:#E91E63;--soft-pink:#FF6B8B;--light-pink:#FFE4EC;--dark-pink:#C2185B;--bg:#F8F9FE;--text-dark:#1A1D2E;--text-medium:#6B7280;--text-light:#9CA3AF;--gold:#FFB300;--success:#00C853;--danger:#E53935;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text-dark);}
  main{max-width:460px;margin:0 auto;padding:20px 24px 40px;}

  .back-btn{width:38px;height:38px;border-radius:12px;background:#fff;border:1px solid rgba(255,228,236,.4);font-size:18px;color:var(--text-dark);cursor:pointer;}
  .center{display:flex;flex-direction:column;align-items:center;text-align:center;}

  .name{margin-top:24px;font-size:22px;font-weight:700;letter-spacing:-.3px;}
  .subtitle{margin-top:6px;font-size:14px;color:var(--text-medium);}

  .stars{margin-top:32px;display:flex;justify-content:center;gap:4px;}
  .star-btn{background:none;border:none;font-size:38px;cursor:pointer;color:#d0d0d0;transition:transform .15s ease;}
  .star-btn.filled{color:var(--gold);transform:scale(1.08);}

  .low-warning{margin-top:24px;width:100%;display:flex;align-items:flex-start;gap:12px;text-align:left;background:rgba(229,57,53,.05);border:1px solid rgba(229,57,53,.2);border-radius:16px;padding:16px;}
  .low-warning span{font-size:13px;color:rgba(229,57,53,.8);line-height:1.4;}

  .review-box{margin-top:28px;width:100%;background:#fff;border-radius:16px;border:1px solid rgba(255,228,236,.5);}
  .review-box textarea{width:100%;border:none;outline:none;padding:14px;font-size:14px;color:var(--text-dark);font-family:inherit;resize:none;border-radius:16px;}

  .submit-btn{margin-top:24px;width:100%;height:56px;border:none;border-radius:16px;background:linear-gradient(to right,var(--primary-pink),var(--dark-pink));color:#fff;font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 5px 15px rgba(233,30,99,.3);}
  .submit-btn:disabled{opacity:.6;cursor:not-allowed;}

  .success-icon{width:100px;height:100px;border-radius:50%;background:linear-gradient(135deg,var(--primary-pink),var(--soft-pink));display:flex;align-items:center;justify-content:center;font-size:48px;color:#fff;box-shadow:0 10px 25px rgba(233,30,99,.3);}
  .success-title{margin-top:32px;font-size:24px;font-weight:700;letter-spacing:-.4px;}
  .success-sub{margin-top:12px;font-size:14px;color:var(--text-medium);line-height:1.5;}
  .btn-outline{margin-top:32px;width:100%;height:54px;border-radius:16px;border:2px solid var(--primary-pink);background:#fff;color:var(--primary-pink);font-weight:600;font-size:15px;cursor:pointer;}
  .btn-gradient{margin-top:16px;width:100%;height:54px;border-radius:16px;border:none;background:linear-gradient(to right,var(--primary-pink),var(--soft-pink));color:#fff;font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 5px 15px rgba(233,30,99,.3);}

  .toast{position:fixed;left:16px;right:16px;bottom:24px;background:#F57C00;color:#fff;padding:14px 16px;border-radius:12px;font-size:14px;text-align:center;max-width:420px;margin:0 auto;z-index:9800;}
</style>
</head>
<body>
  <main id="root">
    <div class="center"><button class="back-btn" id="backBtn" aria-label="Back" style="align-self:flex-start"><i class="ph ph-arrow-left"></i></button></div>
  </main>

<script src="/services/api.js"></script>
<script src="/services/api_endpoints.js"></script>
<script src="/services/session_manager.js"></script>
<script src="/services/route_guard.js"></script>
<script>RouteGuard.require("influencer");</script>
<script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var otherPartyName = params.get("client_name") || "the client";

    var root = document.getElementById("root");
    var rating = 0;
    var isSubmitting = false;

    document.getElementById("backBtn").addEventListener("click", function () { window.history.back(); });

    function escapeHtml(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }
    function showToast(message) {
      var t = document.createElement("div");
      t.className = "toast";
      t.textContent = message;
      document.body.appendChild(t);
      setTimeout(function () { t.remove(); }, 3500);
    }

    function goHome() { window.location.href = "/influencer-home"; }

    function renderForm() {
      var isLowRating = rating > 0 && rating <= 2;
      root.innerHTML =
        '<div class="center">' +
        '<button class="back-btn" id="backBtn" aria-label="Back" style="align-self:flex-start"><i class="ph ph-arrow-left"></i></button>' +
        '<div class="name">Rate ' + escapeHtml(otherPartyName) + "</div>" +
        '<div class="subtitle">How was your call with ' + escapeHtml(otherPartyName) + "?</div>" +
        '<div class="stars" id="stars">' +
        [1, 2, 3, 4, 5].map(function (n) {
          return '<button type="button" class="star-btn' + (n <= rating ? " filled" : "") + '" data-star="' + n + '">' + (n <= rating ? "<i class='ph-fill ph-star'></i>" : "<i class='ph ph-star'></i>") + "</button>";
        }).join("") +
        "</div>" +
        (isLowRating
          ? '<div class="low-warning"><i class="ph ph-info"></i>️<span>3 bad reviews from clients may lead to suspension of your account and loss of all earnings.</span></div>'
          : "") +
        '<div class="review-box"><textarea id="reviewInput" rows="4" placeholder="Share your experience (optional)"></textarea></div>' +
        '<button class="submit-btn" id="submitBtn" style="width:100%"><span id="submitLabel">Submit Rating</span></button>' +
        "</div>";

      document.getElementById("backBtn").addEventListener("click", function () { window.history.back(); });
      document.querySelectorAll(".star-btn").forEach(function (btn) {
        btn.addEventListener("click", function () {
          rating = parseInt(btn.getAttribute("data-star"), 10);
          renderForm();
        });
      });
      document.getElementById("submitBtn").addEventListener("click", submit);
    }

    function renderSuccess() {
      root.innerHTML =
        '<div class="center">' +
        '<div class="success-icon"><i class="ph ph-check"></i></div>' +
        '<div class="success-title">Thanks for your feedback!</div>' +
        '<div class="success-sub">Your rating helps keep the community safe and enjoyable for everyone.</div>' +
        '<button class="btn-outline" id="supportBtn"><i class="ph ph-headset"></i> Contact Support</button>' +
        '<button class="btn-gradient" id="homeBtn">Back to Home</button>' +
        "</div>";
      document.getElementById("supportBtn").addEventListener("click", function () { window.location.href = "/chat-support"; });
      document.getElementById("homeBtn").addEventListener("click", goHome);
    }

    function setSubmitting(loading) {
      isSubmitting = loading;
      var btn = document.getElementById("submitBtn");
      var label = document.getElementById("submitLabel");
      if (!btn) return;
      btn.disabled = loading;
      label.textContent = loading ? "Submitting..." : "Submit Rating";
    }

    async function submit() {
      if (rating === 0) { showToast("Please select a star rating"); return; }
      if (isSubmitting) return;
      setSubmitting(true);

      // NOTE: the backend's review/create.php is client-only — there is no
      // endpoint yet for an influencer to rate a client. This mirrors the
      // Dart source exactly: the rating is captured in the UI (a ~400ms
      // delay so it still *feels* like a submit) but isn't sent anywhere
      // until a real influencer-side endpoint exists.
      await new Promise(function (resolve) { setTimeout(resolve, 400); });
      setSubmitting(false);
      renderSuccess();
    }

    renderForm();
  })();
</script>
</body>
</html>
