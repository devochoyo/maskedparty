<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Earnings — Masked Party</title>
<script src="/widgets/phosphor_icons.js"></script>
<script>PhosphorIcons.load();</script>
<style>
  :root{--primary-pink:#E91E63;--soft-pink:#FF6B8B;--light-pink:#FFE4EC;--bg:#F8F9FE;--card:#fff;--text-dark:#1A1D2E;--text-medium:#6B7280;--text-light:#9CA3AF;--success:#00C853;--danger:#E53935;--gold:#FFC107;--info:#2196F3;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text-dark);}
  header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid rgba(255,228,236,.4);}
  .head-row{max-width:560px;margin:0 auto;display:flex;align-items:center;padding:14px 16px;gap:12px;}
  .back-btn{width:34px;height:34px;border:none;background:none;font-size:18px;color:var(--text-dark);cursor:pointer;}
  h1{font-size:20px;font-weight:700;}
  main{max-width:560px;margin:0 auto;padding:20px 16px 40px;}

  .balance-card{padding:20px;border-radius:20px;background:linear-gradient(135deg,var(--primary-pink),var(--soft-pink));color:#fff;box-shadow:0 8px 20px rgba(233,30,99,.3);}
  .bc-top{display:flex;justify-content:space-between;align-items:center;}
  .bc-icon{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--gold);}
  .bc-balance{margin-top:12px;display:flex;align-items:flex-end;gap:6px;}
  .bc-balance .num{font-size:38px;font-weight:700;}
  .bc-balance .u{font-size:17px;font-weight:600;padding-bottom:6px;}
  .withdraw-btn{margin-top:20px;width:100%;height:48px;border:none;border-radius:14px;background:#fff;color:var(--primary-pink);font-weight:700;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}

  .tabs{margin-top:24px;display:flex;padding:4px;background:#fff;border-radius:18px;border:1px solid rgba(255,228,236,.4);}
  .tab-btn{flex:1;padding:10px 0;border-radius:14px;border:none;background:none;font-weight:600;font-size:12px;color:var(--text-medium);cursor:pointer;}
  .tab-btn.active{background:linear-gradient(135deg,var(--primary-pink),var(--soft-pink));color:#fff;font-weight:700;box-shadow:0 3px 8px rgba(233,30,99,.3);}

  .section-head{margin-top:24px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;}
  .section-ic{width:32px;height:32px;border-radius:10px;background:rgba(233,30,99,.1);color:var(--primary-pink);display:flex;align-items:center;justify-content:center;font-size:16px;}

  .stats-card{margin-top:12px;background:var(--card);border-radius:20px;border:1px solid rgba(255,228,236,.4);padding:18px;display:flex;justify-content:space-around;}
  .stat-item{display:flex;flex-direction:column;align-items:center;}
  .stat-ic{font-size:18px;}
  .stat-val{margin-top:6px;font-weight:700;font-size:16px;}
  .stat-lab{margin-top:2px;font-size:11px;color:var(--text-medium);}
  .stat-divider{width:1px;height:40px;background:rgba(255,228,236,.5);}

  .tx-empty{margin-top:12px;padding:32px;text-align:center;background:var(--card);border-radius:20px;border:1px solid rgba(255,228,236,.4);color:var(--text-light);font-size:13px;}
  .tx-list{margin-top:12px;background:var(--card);border-radius:20px;border:1px solid rgba(255,228,236,.4);overflow:hidden;}
  .tx-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid rgba(255,228,236,.3);}
  .tx-item:last-child{border-bottom:none;}
  .tx-ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:16px;}
  .tx-desc{font-weight:600;font-size:13px;}
  .tx-date{margin-top:2px;font-size:10px;color:var(--text-light);}
  .tx-value{margin-left:auto;font-weight:700;font-size:13px;flex:none;}

  .spinner-wrap{display:flex;justify-content:center;padding:80px 0;}
  .spinner{width:32px;height:32px;border:3px solid rgba(233,30,99,.2);border-top-color:var(--primary-pink);border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .state{text-align:center;padding:60px 24px;}
  .retry-btn{margin-top:16px;padding:10px 20px;border-radius:12px;border:none;background:var(--primary-pink);color:#fff;font-weight:700;font-size:14px;cursor:pointer;}
</style>
</head>
<body>
  <header><div class="head-row"><button class="back-btn" id="backBtn" aria-label="Back"><i class="ph ph-arrow-left"></i></button><h1>Earnings</h1></div></header>
  <main id="root"><div class="spinner-wrap"><div class="spinner" role="status" aria-label="Loading"></div></div></main>

<script src="/services/api.js"></script>
<script src="/services/api_endpoints.js"></script>
<script src="/services/session_manager.js"></script>
<script src="/services/route_guard.js"></script>
<script>RouteGuard.require("influencer");</script>
<script src="/services/influencer_service.js"></script>
<script src="/services/wallet_service.js"></script>
<script>
  (function () {
    var root = document.getElementById("root");
    document.getElementById("backBtn").addEventListener("click", function () { window.history.back(); });

    var earnings = null, history = [], errorMessage = null, tabIndex = 0;

    function escapeHtml(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }
    function periodValue(key) {
      if (!earnings) return 0;
      var v = earnings[key];
      if (typeof v === "number") return v;
      var n = parseFloat(v);
      return isNaN(n) ? 0 : n;
    }
    function periodEarningsKey() { return tabIndex === 1 ? "this_week_earnings" : tabIndex === 2 ? "this_month_earnings" : "today_earnings"; }
    function periodCallsKey() { return tabIndex === 1 ? "this_week_calls" : tabIndex === 2 ? "this_month_calls" : "today_calls"; }

    function formatRelative(dateStr) {
      if (!dateStr) return "";
      try {
        var dt = new Date(dateStr);
        var diffMs = Date.now() - dt.getTime();
        var mins = Math.floor(diffMs / 60000), hours = Math.floor(mins / 60), days = Math.floor(hours / 24);
        if (days > 7) return dt.getDate() + "/" + (dt.getMonth() + 1) + "/" + dt.getFullYear();
        if (days > 0) return days + "d ago";
        if (hours > 0) return hours + "h ago";
        if (mins > 0) return mins + "m ago";
        return "Just now";
      } catch (e) { return dateStr; }
    }

    function txRow(item) {
      var description = item.description || item.type || "Transaction";
      var amount = item.amount;
      var amountNum = typeof amount === "number" ? amount : parseFloat(amount) || 0;
      var isCredit = amountNum >= 0;
      var coins = item.coins;

      return (
        '<div class="tx-item">' +
        '<div class="tx-ic" style="background:' + (isCredit ? "rgba(0,200,83,.12)" : "rgba(229,57,53,.12)") + ";color:" + (isCredit ? "#00C853" : "#E53935") + '">' + (isCredit ? "<i class='ph ph-arrow-down'></i>" : "<i class='ph ph-arrow-up'></i>") + "</div>" +
        '<div><div class="tx-desc">' + escapeHtml(description) + '</div><div class="tx-date">' + formatRelative(item.created_at || item.date) + "</div></div>" +
        '<div class="tx-value" style="color:' + (isCredit ? "#00C853" : "#E53935") + '">' + (coins != null ? (isCredit ? "+" : "") + coins + " Coins" : amountNum) + "</div>" +
        "</div>"
      );
    }

    function render() {
      if (errorMessage && !earnings) {
        root.innerHTML =
          '<div class="state"><div style="font-size:36px"><i class="ph ph-warning"></i></div>' +
          '<div style="margin-top:12px;font-weight:700">' + escapeHtml(errorMessage) + "</div>" +
          '<button class="retry-btn" id="retryBtn">Retry</button></div>';
        document.getElementById("retryBtn").addEventListener("click", load);
        return;
      }

      var availableBalance = periodValue("wallet_balance") !== 0 ? periodValue("wallet_balance") : periodValue("available_balance");

      root.innerHTML =
        '<div class="balance-card">' +
        '<div class="bc-top"><div class="bc-label">Available Balance</div><div class="bc-icon"><i class="ph ph-coins"></i></div></div>' +
        '<div class="bc-balance"><div class="num">' + availableBalance.toFixed(2) + '</div><div class="u">Coins</div></div>' +
        '<button class="withdraw-btn" id="withdrawBtn"><i class="ph ph-credit-card"></i> Withdraw</button>' +
        "</div>" +
        '<div class="tabs" id="tabs">' +
        ["Today", "This Week", "This Month"].map(function (label, i) {
          return '<button class="tab-btn' + (tabIndex === i ? " active" : "") + '" data-i="' + i + '">' + label + "</button>";
        }).join("") +
        "</div>" +
        '<div class="section-head"><div class="section-ic"><i class="ph ph-chart-bar"></i></div>Statistics</div>' +
        '<div class="stats-card">' +
        '<div class="stat-item"><span class="stat-ic"><i class="ph ph-phone"></i></span><div class="stat-val">' + periodValue(periodCallsKey()) + '</div><div class="stat-lab">Calls</div></div>' +
        '<div class="stat-divider"></div>' +
        '<div class="stat-item"><span class="stat-ic" style="color:#00C853"><i class="ph ph-coins"></i></span><div class="stat-val">' + periodValue(periodEarningsKey()).toFixed(0) + '</div><div class="stat-lab">Earnings</div></div>' +
        '<div class="stat-divider"></div>' +
        '<div class="stat-item"><span class="stat-ic" style="color:#2196F3"><i class="ph ph-trend-up"></i></span><div class="stat-val">' + periodValue("lifetime_earnings").toFixed(0) + '</div><div class="stat-lab">Lifetime</div></div>' +
        "</div>" +
        '<div class="section-head"><div class="section-ic"><i class="ph ph-receipt"></i></div>Recent Transactions</div>' +
        (history.length === 0
          ? '<div class="tx-empty">No transactions yet</div>'
          : '<div class="tx-list">' + history.map(txRow).join("") + "</div>");

      document.getElementById("withdrawBtn").addEventListener("click", function () { window.location.href = "/withdrawal"; });
      document.getElementById("tabs").querySelectorAll(".tab-btn").forEach(function (btn) {
        btn.addEventListener("click", function () { tabIndex = parseInt(btn.getAttribute("data-i"), 10); render(); });
      });
    }

    async function load() {
      root.innerHTML = '<div class="spinner-wrap"><div class="spinner" role="status" aria-label="Loading"></div></div>';
      var token = SessionManager.getToken();
      try {
        var results = await Promise.all([InfluencerService.getEarnings(token), WalletService.getHistory(token, { limit: 20 })]);
        var earningsResult = results[0], historyResult = results[1];
        if (earningsResult && earningsResult.success === true) {
          earnings = earningsResult.data || {};
        } else {
          errorMessage = (earningsResult && earningsResult.message) || "Failed to load earnings";
        }
        if (historyResult && historyResult.success === true) {
          var raw = historyResult.data;
          history = Array.isArray(raw) ? raw : (raw && (raw.history || raw.transactions)) || [];
        }
        render();
      } catch (e) {
        errorMessage = "Something went wrong. Please try again.";
        render();
      }
    }

    load();
  })();
</script>
</body>
</html>
