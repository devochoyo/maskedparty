<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Followers — Masked Party</title>
<script src="/widgets/phosphor_icons.js"></script>
<script>PhosphorIcons.load();</script>
<style>
  :root{--primary-pink:#E91E63;--soft-pink:#FF6B8B;--bg:#F8F9FE;--text-dark:#1A1D2E;--text-medium:#6B7280;--text-light:#9CA3AF;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text-dark);padding-bottom:80px;}
  header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid rgba(255,228,236,.4);}
  .head-row{max-width:560px;margin:0 auto;display:flex;align-items:center;padding:14px 16px;gap:12px;}
  .back-btn{width:34px;height:34px;border:none;background:none;font-size:18px;color:var(--text-dark);cursor:pointer;}
  h1{flex:1;font-size:20px;font-weight:700;}
  .count-pill{font-size:12px;font-weight:700;color:var(--primary-pink);background:rgba(233,30,99,.1);padding:4px 10px;border-radius:12px;}
  main{max-width:560px;margin:0 auto;padding:16px;}

  .f-tile{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:12px 14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.03);}
  .f-avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,var(--primary-pink),var(--soft-pink));display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;flex:none;}
  .f-name{font-weight:700;font-size:14px;}
  .f-loc{margin-top:2px;font-size:12px;color:var(--text-medium);}

  .state{display:flex;flex-direction:column;align-items:center;text-align:center;padding:70px 24px;}
  .state-icon-wrap{width:90px;height:90px;border-radius:50%;background:rgba(233,30,99,.08);display:flex;align-items:center;justify-content:center;font-size:40px;}
  .state-title{margin-top:18px;font-weight:700;font-size:17px;}
  .state-sub{margin-top:6px;font-size:14px;color:var(--text-medium);}

  .spinner-wrap{display:flex;justify-content:center;padding:70px 0;}
  .spinner{width:32px;height:32px;border:3px solid rgba(233,30,99,.2);border-top-color:var(--primary-pink);border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}

</style>
</head>
<body>
  <header><div class="head-row"><button class="back-btn" id="backBtn" aria-label="Back"><i class="ph ph-arrow-left"></i></button><h1>Followers</h1><span class="count-pill" id="countPill">0</span></div></header>
  <main id="root"><div class="spinner-wrap"><div class="spinner" role="status" aria-label="Loading"></div></div></main>

  <script src="/widgets/phosphor_icons.js"></script>
  <script src="/widgets/influencer_bottom_nav.js"></script>
  <script>InfluencerBottomNav.mount("followers");</script>

<script src="/services/api.js"></script>
<script src="/services/api_endpoints.js"></script>
<script src="/services/session_manager.js"></script>
<script src="/services/route_guard.js"></script>
<script>RouteGuard.require("influencer");</script>
<script src="/services/follow_service.js"></script>
<script>
  (function () {
    var root = document.getElementById("root");
    document.getElementById("backBtn").addEventListener("click", function () { window.history.back(); });

    function escapeHtml(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }

    function tileHtml(f) {
      var photo = f.profile_photo;
      var name = f.mystery_name || "User";
      var country = f.country_name;
      return (
        '<div class="f-tile">' +
        (photo ? '<img class="f-avatar" src="' + photo + '" alt="">' : '<div class="f-avatar"><i class="ph ph-user"></i></div>') +
        '<div><div class="f-name">' + escapeHtml(name) + "</div>" +
        (country ? '<div class="f-loc"><i class="ph ph-map-pin"></i> ' + escapeHtml(country) + "</div>" : "") +
        "</div></div>"
      );
    }

    async function load() {
      var user = SessionManager.getUser();
      var myId = user && user.id;
      if (!myId) { root.innerHTML = '<div class="state"><div class="state-icon-wrap"><i class="ph ph-users"></i></div><div class="state-title">Could not load followers</div></div>'; return; }

      var result = await FollowService.listFollowers(myId);
      if (result && result.success === true && result.data) {
        var followers = result.data.followers || [];
        var total = result.data.follower_count != null ? result.data.follower_count : followers.length;
        document.getElementById("countPill").textContent = total;
        if (followers.length === 0) {
          root.innerHTML = '<div class="state"><div class="state-icon-wrap"><i class="ph ph-users"></i></div><div class="state-title">No followers yet</div><div class="state-sub">Followers will show up here.</div></div>';
        } else {
          root.innerHTML = followers.map(tileHtml).join("");
        }
      } else {
        root.innerHTML = '<div class="state"><div class="state-icon-wrap"><i class="ph ph-warning"></i></div><div class="state-title">Could not load followers</div></div>';
      }
    }

    load();
  })();
</script>
</body>
</html>
