<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chats — Masked Party</title>
<script src="/widgets/phosphor_icons.js"></script>
<script>PhosphorIcons.load();</script>
<style>
  :root{--primary-pink:#E91E63;--soft-pink:#FF6B8B;--light-pink:#FFE4EC;--bg:#F8F9FE;--text-dark:#1A1D2E;--text-medium:#6B7280;--text-light:#9CA3AF;--online:#00C853;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text-dark);padding-bottom:80px;}

  header{position:sticky;top:0;z-index:10;background:#fff;}
  .head-inner{max-width:600px;margin:0 auto;padding:16px 16px 4px;}
  h1{font-size:26px;font-weight:800;letter-spacing:-.5px;}
  .search-wrap{margin:12px 0;height:44px;background:#fff;border:1px solid rgba(255,228,236,.7);border-radius:14px;display:flex;align-items:center;padding:0 14px;gap:8px;box-shadow:0 2px 8px rgba(233,30,99,.04);}
  .search-wrap input{flex:1;border:none;outline:none;font-size:14px;background:none;}

  main{max-width:600px;margin:0 auto;padding:8px 16px;}

  .c-tile{display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:12px 14px;margin-bottom:10px;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.03);border:1px solid transparent;}
  .c-tile.unread{border-color:rgba(233,30,99,.15);}
  .c-avatar-wrap{position:relative;width:52px;height:52px;flex:none;}
  .c-avatar{width:52px;height:52px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,var(--primary-pink),var(--soft-pink));display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;}
  .c-online-dot{position:absolute;bottom:1px;right:1px;width:12px;height:12px;border-radius:50%;background:var(--online);border:2px solid #fff;}
  .c-name-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  .c-name{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .c-time{font-size:11px;color:var(--text-light);flex:none;}
  .c-msg-row{display:flex;justify-content:space-between;align-items:center;margin-top:3px;gap:8px;}
  .c-msg{font-size:13px;color:var(--text-medium);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}
  .c-tile.unread .c-msg{color:var(--text-dark);font-weight:600;}
  .c-badge{background:var(--primary-pink);color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:2px 7px;flex:none;}

  .state{display:flex;flex-direction:column;align-items:center;text-align:center;padding:70px 24px;}
  .state-icon-wrap{width:90px;height:90px;border-radius:50%;background:rgba(233,30,99,.08);display:flex;align-items:center;justify-content:center;font-size:40px;}
  .state-title{margin-top:18px;font-weight:700;font-size:17px;}
  .state-sub{margin-top:6px;font-size:14px;color:var(--text-medium);}
  .retry-btn{margin-top:20px;padding:10px 20px;border-radius:12px;border:1.5px solid var(--primary-pink);background:#fff;color:var(--primary-pink);font-weight:700;font-size:14px;cursor:pointer;}

  .spinner-wrap{display:flex;justify-content:center;padding:60px 0;}
  .spinner{width:32px;height:32px;border:3px solid rgba(233,30,99,.2);border-top-color:var(--primary-pink);border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}

</style>
</head>
<body>
  <header>
    <div class="head-inner">
      <h1>Chats</h1>
      <div class="search-wrap"><i class="ph ph-magnifying-glass"></i><input type="text" id="searchInput" placeholder="Search chats…"></div>
    </div>
  </header>
  <main id="listRoot"><div class="spinner-wrap"><div class="spinner" role="status" aria-label="Loading"></div></div></main>

  <script src="/widgets/phosphor_icons.js"></script>
  <script src="/widgets/influencer_bottom_nav.js"></script>
  <script>InfluencerBottomNav.mount("chat");</script>

<script src="/services/api.js"></script>
<script src="/services/api_endpoints.js"></script>
<script src="/services/session_manager.js"></script>
<script src="/services/route_guard.js"></script>
<script>RouteGuard.require("influencer");</script>
<script src="/services/chat_service.js"></script>
<script>
  (function () {
    var listRoot = document.getElementById("listRoot");
    var searchInput = document.getElementById("searchInput");
    var conversations = [];
    var query = "";
    var poller = null;

    function escapeHtml(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }
    function formatLastSeen(dateStr) {
      if (!dateStr) return "";
      try {
        var dt = new Date(dateStr);
        var diffMs = Date.now() - dt.getTime();
        var mins = Math.floor(diffMs / 60000), hours = Math.floor(mins / 60), days = Math.floor(hours / 24);
        if (days > 7) return dt.getDate() + "/" + (dt.getMonth() + 1) + "/" + dt.getFullYear();
        if (days > 0) return days + "d";
        if (hours > 0) return hours + "h";
        if (mins > 0) return mins + "m";
        return "now";
      } catch (e) { return ""; }
    }

    function filtered() {
      if (!query) return conversations;
      return conversations.filter(function (c) {
        var user = c.other_user || c.user || {};
        var name = (user.mystery_name || "").toLowerCase();
        return name.indexOf(query) !== -1;
      });
    }

    function tileHtml(conv) {
      var user = conv.other_user || conv.user || {};
      var name = user.mystery_name || "User";
      var photo = user.profile_photo;
      var lastMessage = conv.last_message || "";
      var time = conv.last_message_time || conv.last_message_at || "";
      var unreadCount = typeof conv.unread_count === "number" && conv.unread_count > 0 ? conv.unread_count : 0;
      var otherUserId = user.id != null ? String(user.id) : "";
      var isOnline = user.online_status === "online";

      return (
        '<div class="c-tile' + (unreadCount ? " unread" : "") + '" data-id="' + otherUserId + '" data-name="' + escapeHtml(name) + '" data-photo="' + (photo || "") + '">' +
        '<div class="c-avatar-wrap">' +
        (photo ? '<img class="c-avatar" src="' + photo + '" alt="">' : '<div class="c-avatar"><i class="ph ph-user"></i></div>') +
        (isOnline ? '<span class="c-online-dot"></span>' : "") +
        "</div>" +
        '<div style="flex:1;min-width:0">' +
        '<div class="c-name-row"><div class="c-name">' + escapeHtml(name) + '</div><div class="c-time">' + formatLastSeen(time) + "</div></div>" +
        '<div class="c-msg-row"><div class="c-msg">' + escapeHtml(lastMessage) + "</div>" +
        (unreadCount ? '<div class="c-badge">' + unreadCount + "</div>" : "") +
        "</div></div></div>"
      );
    }

    function render() {
      var list = filtered();
      if (list.length === 0) {
        listRoot.innerHTML =
          '<div class="state"><div class="state-icon-wrap"><i class="ph ph-chat-circle"></i></div>' +
          '<div class="state-title">No conversations yet</div>' +
          '<div class="state-sub">Messages from clients will show up here.</div></div>';
        return;
      }
      listRoot.innerHTML = list.map(tileHtml).join("");
      listRoot.querySelectorAll(".c-tile").forEach(function (tile) {
        tile.addEventListener("click", function () {
          var id = tile.getAttribute("data-id");
          var name = tile.getAttribute("data-name");
          var photo = tile.getAttribute("data-photo");
          window.location.href = "/chat/" + id + "?name=" + encodeURIComponent(name) + (photo ? "&photo=" + encodeURIComponent(photo) : "");
        });
      });
    }

    function renderError(message) {
      listRoot.innerHTML =
        '<div class="state"><div class="state-icon-wrap"><i class="ph ph-warning"></i></div>' +
        '<div class="state-title">Something went wrong</div>' +
        '<div class="state-sub">' + escapeHtml(message) + "</div>" +
        '<button class="retry-btn" id="retryBtn">Retry</button></div>';
      document.getElementById("retryBtn").addEventListener("click", function () { load(false); });
    }

    async function load(silent) {
      var token = SessionManager.getToken();
      if (!silent) listRoot.innerHTML = '<div class="spinner-wrap"><div class="spinner" role="status" aria-label="Loading"></div></div>';
      try {
        var result = await ChatService.getConversations(token);
        if (result && result.success === true) {
          var data = result.data;
          conversations = Array.isArray(data) ? data : (data && (data.conversations || data.chats)) || [];
          render();
        } else if (!silent) {
          renderError((result && result.message) || "Failed to load conversations");
        }
      } catch (e) {
        if (!silent) renderError("Something went wrong. Please try again.");
      }
    }

    searchInput.addEventListener("input", function () {
      query = searchInput.value.trim().toLowerCase();
      render();
    });

    load(false);
    poller = setInterval(function () { load(true); }, 2000);
    window.addEventListener("beforeunload", function () { clearInterval(poller); });
  })();
</script>
</body>
</html>
