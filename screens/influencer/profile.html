<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Profile — Masked Party</title>
<script src="/widgets/phosphor_icons.js"></script>
<script>PhosphorIcons.load();</script>
<style>
  :root{--primary-pink:#E91E63;--soft-pink:#FF6B8B;--light-pink:#FFE4EC;--bg:#F8F9FE;--card:#fff;--text-dark:#1A1D2E;--text-medium:#6B7280;--text-light:#9CA3AF;--success:#00C853;--gold:#FFB300;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text-dark);padding-bottom:80px;}

  main{max-width:520px;margin:0 auto;}
  .top-row{display:flex;justify-content:space-between;padding:16px;}
  .round-btn{width:40px;height:40px;border-radius:12px;background:#fff;border:1px solid rgba(255,228,236,.6);font-size:16px;cursor:pointer;color:var(--text-dark);box-shadow:0 2px 8px rgba(233,30,99,.06);}

  .p-center{display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 16px;}
  .p-avatar-ring{padding:4px;border-radius:65px;background:linear-gradient(135deg,var(--primary-pink),var(--soft-pink),#7C4DFF);box-shadow:0 10px 25px rgba(233,30,99,.3);}
  .p-avatar-inner{padding:3px;border-radius:61px;background:#fff;}
  .p-avatar{width:112px;height:112px;border-radius:58px;object-fit:cover;background:linear-gradient(135deg,var(--primary-pink),var(--soft-pink));display:flex;align-items:center;justify-content:center;color:#fff;font-size:40px;font-weight:700;}
  .p-name-row{margin-top:16px;display:flex;align-items:center;gap:6px;}
  .p-name{font-size:24px;font-weight:700;letter-spacing:-.5px;}
  .verified-badge{width:24px;height:24px;border-radius:50%;background:rgba(0,200,83,.1);display:flex;align-items:center;justify-content:center;color:var(--success);font-size:14px;}
  .p-loc{margin-top:6px;padding:5px 14px;border-radius:20px;background:rgba(233,30,99,.08);border:1px solid rgba(233,30,99,.15);color:var(--primary-pink);font-weight:600;font-size:13px;}

  .stats-card{margin-top:16px;background:#fff;border-radius:20px;border:1px solid rgba(255,228,236,.5);padding:16px 30px;display:flex;align-items:center;box-shadow:0 3px 10px rgba(233,30,99,.06);}
  .stat-item{display:flex;flex-direction:column;align-items:center;flex:1;}
  .stat-item .val{margin-top:6px;font-weight:700;font-size:17px;}
  .stat-item .lab{margin-top:2px;font-size:11px;color:var(--text-medium);}
  .stat-divider{width:1px;height:40px;background:rgba(255,228,236,.5);}

  .about-card{margin:20px 16px 0;background:var(--card);border-radius:20px;border:1px solid rgba(255,228,236,.4);padding:20px;}
  .about-head{display:flex;align-items:center;gap:10px;}
  .about-ic{width:32px;height:32px;border-radius:10px;background:rgba(233,30,99,.1);color:var(--primary-pink);display:flex;align-items:center;justify-content:center;font-size:16px;}
  .about-head span{font-weight:700;font-size:14px;}
  .about-text{margin-top:10px;font-size:13px;color:var(--text-medium);line-height:1.6;}

  .menu-card{margin:16px 16px 0;background:var(--card);border-radius:20px;border:1px solid rgba(255,228,236,.5);overflow:hidden;box-shadow:0 3px 10px rgba(233,30,99,.05);}
  .menu-item{display:flex;align-items:center;gap:14px;padding:16px 18px;border-bottom:1px solid rgba(255,228,236,.3);cursor:pointer;background:none;border-left:none;border-right:none;border-top:none;width:100%;text-align:left;}
  .menu-item:last-child{border-bottom:none;}
  .menu-icon{width:38px;height:38px;border-radius:12px;background:rgba(233,30,99,.1);color:var(--primary-pink);display:flex;align-items:center;justify-content:center;font-size:17px;flex:none;}
  .menu-title{font-weight:600;font-size:14px;}
  .menu-sub{margin-top:2px;font-size:11px;color:var(--text-medium);}
  .menu-arrow{margin-left:auto;color:var(--text-light);}

  .logout-card{margin:12px 16px 0;background:var(--card);border-radius:20px;border:1px solid rgba(233,30,99,.15);}
  .logout-item{display:flex;align-items:center;gap:14px;padding:16px 18px;cursor:pointer;background:none;border:none;width:100%;text-align:left;}
  .logout-item .menu-icon{color:var(--primary-pink);}
  .logout-item .menu-title{color:var(--primary-pink);}

  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9500;display:flex;align-items:center;justify-content:center;padding:24px;}
  .confirm-card{background:#fff;border-radius:24px;padding:24px;max-width:360px;width:100%;}
  .confirm-title{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:700;}
  .confirm-body{margin-top:12px;font-size:15px;color:var(--text-medium);line-height:1.4;}
  .confirm-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;}
  .confirm-actions button{padding:10px 20px;border-radius:12px;font-weight:600;font-size:14px;cursor:pointer;border:none;}
  .confirm-actions .cancel{background:none;color:var(--text-medium);}
  .confirm-actions .confirm{background:var(--primary-pink);color:#fff;}

  .spinner-wrap{display:flex;justify-content:center;padding:100px 0;}
  .spinner{width:32px;height:32px;border:3px solid rgba(233,30,99,.2);border-top-color:var(--primary-pink);border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}

</style>
</head>
<body>
  <div class="top-row">
    <button class="round-btn" id="backBtn" aria-label="Back"><i class="ph ph-arrow-left"></i></button>
    <button class="round-btn" id="editBtn" aria-label="Edit profile"><i class="ph ph-pencil-simple"></i></button>
  </div>
  <main id="root"><div class="spinner-wrap"><div class="spinner" role="status" aria-label="Loading"></div></div></main>

  <script src="/widgets/phosphor_icons.js"></script>
  <script src="/widgets/influencer_bottom_nav.js"></script>
  <script>InfluencerBottomNav.mount("profile");</script>

<script src="/services/api.js"></script>
<script src="/services/api_endpoints.js"></script>
<script src="/services/session_manager.js"></script>
<script src="/services/route_guard.js"></script>
<script>RouteGuard.require("influencer");</script>
<script src="/services/auth_service.js"></script>
<script src="/services/profile_service.js"></script>
<script src="/services/influencer_service.js"></script>
<script>
  (function () {
    var root = document.getElementById("root");
    document.getElementById("backBtn").addEventListener("click", function () { window.history.back(); });
    document.getElementById("editBtn").addEventListener("click", function () { window.location.href = "/influencer-edit-profile"; });

    function escapeHtml(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }

    function render(profile, earnings) {
      var name = profile.mystery_name || "Influencer";
      var photo = profile.profile_photo;
      var country = profile.country_name;
      var biography = profile.biography;
      var verificationStatus = profile.verification_status;
      var verified = verificationStatus === "verified" || verificationStatus === "approved";
      var rating = profile.average_rating || "0.0";
      var lifetimeCalls = (earnings && earnings.total_calls) || profile.total_calls || 0;

      root.innerHTML =
        '<div class="p-center">' +
        '<div class="p-avatar-ring"><div class="p-avatar-inner">' +
        (photo ? '<img class="p-avatar" src="' + photo + '" alt="">' : '<div class="p-avatar">' + name.charAt(0).toUpperCase() + "</div>") +
        "</div></div>" +
        '<div class="p-name-row"><div class="p-name">' + escapeHtml(name) + "</div>" +
        (verified ? '<div class="verified-badge"><i class="ph ph-check"></i></div>' : "") + "</div>" +
        (country ? '<div class="p-loc"><i class="ph ph-map-pin"></i> ' + escapeHtml(country) + "</div>" : "") +
        '<div class="stats-card">' +
        '<div class="stat-item"><span><i class="ph ph-phone"></i></span><div class="val">' + lifetimeCalls + '</div><div class="lab">Calls</div></div>' +
        '<div class="stat-divider"></div>' +
        '<div class="stat-item"><span style="color:var(--gold)"><i class="ph-fill ph-star"></i></span><div class="val">' + rating + '</div><div class="lab">Rating</div></div>' +
        "</div>" +
        "</div>" +
        (biography
          ? '<div class="about-card"><div class="about-head"><div class="about-ic"><i class="ph ph-info"></i>️</div><span>About Me</span></div><div class="about-text">' + escapeHtml(biography) + "</div></div>"
          : "") +
        '<div class="menu-card">' +
        '<button class="menu-item" id="referralsBtn"><div class="menu-icon"><i class="ph ph-gift"></i></div><div><div class="menu-title">Referrals</div><div class="menu-sub">Invite friends &amp; earn rewards</div></div><span class="menu-arrow"><i class="ph ph-caret-right"></i></span></button>' +
        '<button class="menu-item" id="galleryBtn"><div class="menu-icon"><i class="ph ph-image"></i></div><div><div class="menu-title">Gallery</div><div class="menu-sub">Manage your photos</div></div><span class="menu-arrow"><i class="ph ph-caret-right"></i></span></button>' +
        '<button class="menu-item" id="verificationBtn"><div class="menu-icon"><i class="ph ph-shield-check"></i></div><div><div class="menu-title">Verification</div><div class="menu-sub">Verify your account</div></div><span class="menu-arrow"><i class="ph ph-caret-right"></i></span></button>' +
        "</div>" +
        '<div class="logout-card"><button class="logout-item" id="logoutBtn"><div class="menu-icon"><i class="ph ph-sign-out"></i></div><div><div class="menu-title">Logout</div></div><span class="menu-arrow" style="color:var(--primary-pink)"><i class="ph ph-caret-right"></i></span></button></div>';

      document.getElementById("referralsBtn").addEventListener("click", function () { window.location.href = "/referrals"; });
      document.getElementById("galleryBtn").addEventListener("click", function () { window.location.href = "/gallery"; });
      document.getElementById("verificationBtn").addEventListener("click", function () { window.location.href = "/verification"; });
      document.getElementById("logoutBtn").addEventListener("click", confirmLogout);
    }

    function confirmLogout() {
      var backdrop = document.createElement("div");
      backdrop.className = "modal-backdrop";
      backdrop.innerHTML =
        '<div class="confirm-card">' +
        '<div class="confirm-title"><i class="ph ph-sign-out"></i> Logout</div>' +
        '<div class="confirm-body">Are you sure you want to logout?</div>' +
        '<div class="confirm-actions"><button class="cancel" id="cancelLogout">Cancel</button><button class="confirm" id="confirmLogout">Logout</button></div>' +
        "</div>";
      document.body.appendChild(backdrop);
      backdrop.addEventListener("click", function (e) { if (e.target === backdrop) backdrop.remove(); });
      backdrop.querySelector("#cancelLogout").addEventListener("click", function () { backdrop.remove(); });
      backdrop.querySelector("#confirmLogout").addEventListener("click", async function () {
        backdrop.remove();
        var token = SessionManager.getToken();
        if (token) await AuthService.logout(token);
        SessionManager.clearSession();
        window.location.href = "/login";
      });
    }

    async function load() {
      var token = SessionManager.getToken();
      var results = await Promise.all([ProfileService.getProfile(token), InfluencerService.getEarnings(token)]);
      var profResult = results[0], earningsResult = results[1];
      var profile = profResult && profResult.success === true ? profResult.data : {};
      var earnings = earningsResult && earningsResult.success === true ? earningsResult.data : null;
      render(profile || {}, earnings);
    }

    load();
  })();
</script>
</body>
</html>
