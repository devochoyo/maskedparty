<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notifications — Masked Party</title>
<script src="/widgets/phosphor_icons.js"></script>
<script>PhosphorIcons.load();</script>
<style>
  :root{--primary-pink:#E91E63;--light-pink:#FFE4EC;--bg:#F8F9FE;--text-dark:#1A1D2E;--text-medium:#6B7280;--text-light:#9CA3AF;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text-dark);}

  header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid rgba(255,228,236,.4);}
  .head-row{max-width:600px;margin:0 auto;display:flex;align-items:center;padding:14px 16px;gap:12px;}
  .back-btn{width:34px;height:34px;border:none;background:none;font-size:18px;color:var(--text-dark);cursor:pointer;}
  h1{flex:1;font-size:22px;font-weight:700;letter-spacing:-.3px;}
  .mark-all{border:none;background:none;color:var(--primary-pink);font-weight:700;font-size:13px;cursor:pointer;display:none;}

  main{max-width:600px;margin:0 auto;padding:14px 16px 32px;}

  .n-tile{display:flex;align-items:flex-start;gap:14px;padding:16px;border-radius:18px;margin-bottom:10px;cursor:pointer;background:var(--bg);border:1px solid rgba(255,228,236,.3);}
  .n-tile.unread{background:#fff;border:1.5px solid rgba(233,30,99,.2);box-shadow:0 3px 10px rgba(233,30,99,.08);}
  .n-icon{width:50px;height:50px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none;}
  .n-title-row{display:flex;align-items:flex-start;gap:8px;}
  .n-title{flex:1;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .n-tile.unread .n-title{font-weight:700;}
  .n-time{font-size:11px;color:var(--text-light);font-weight:500;flex:none;}
  .n-sub{margin-top:4px;font-size:13px;color:var(--text-medium);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .n-dot{width:10px;height:10px;border-radius:50%;background:var(--primary-pink);margin-top:6px;flex:none;box-shadow:0 2px 6px rgba(233,30,99,.4);}

  .state{display:flex;flex-direction:column;align-items:center;text-align:center;padding:80px 24px;}
  .state-icon-wrap{width:90px;height:90px;border-radius:50%;background:rgba(233,30,99,.08);display:flex;align-items:center;justify-content:center;font-size:40px;}
  .state.error .state-icon-wrap{background:rgba(211,47,47,.08);}
  .state-title{margin-top:18px;font-weight:600;font-size:17px;}
  .state-sub{margin-top:6px;font-size:14px;color:var(--text-medium);}
  .retry-btn{margin-top:24px;padding:12px 24px;border-radius:14px;border:none;background:var(--primary-pink);color:#fff;font-weight:700;font-size:14px;cursor:pointer;}

  .spinner-wrap{display:flex;justify-content:center;padding:80px 0;}
  .spinner{width:32px;height:32px;border:3px solid rgba(233,30,99,.2);border-top-color:var(--primary-pink);border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <header>
    <div class="head-row">
      <button class="back-btn" id="backBtn" aria-label="Back"><i class="ph ph-arrow-left"></i></button>
      <h1>Notifications</h1>
      <button class="mark-all" id="markAllBtn">Mark all read</button>
    </div>
  </header>
  <main id="listRoot"><div class="spinner-wrap"><div class="spinner" role="status" aria-label="Loading"></div></div></main>

<script src="/services/api.js"></script>
<script src="/services/api_endpoints.js"></script>
<script src="/services/session_manager.js"></script>
<script src="/services/route_guard.js"></script>
<script>RouteGuard.require("influencer");</script>
<script src="/services/notification_service.js"></script>
<script>
  (function () {
    var listRoot = document.getElementById("listRoot");
    var markAllBtn = document.getElementById("markAllBtn");
    var notifications = [];

    document.getElementById("backBtn").addEventListener("click", function () { window.history.back(); });

    function escapeHtml(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }

    var ICONS = { call: "<i class='ph ph-phone'></i>", call_request: "<i class='ph ph-phone'></i>", verification: "<i class='ph-fill ph-check-circle'></i>", withdrawal: "<i class='ph ph-credit-card'></i>", review: "<i class='ph-fill ph-star'></i>", message: "<i class='ph ph-envelope-simple'></i>", chat: "<i class='ph ph-envelope-simple'></i>", profile: "<i class='ph ph-user'></i>" };
    var COLORS = { call: "#E91E63", call_request: "#E91E63", verification: "#00BFA5", withdrawal: "#00BFA5", review: "#FFB300", message: "#9C27B0", chat: "#9C27B0", profile: "#2196F3" };

    function timeAgo(notif) {
      var date = notif.created_at;
      if (!date) return "";
      try {
        var dt = new Date(date);
        var diffMs = Date.now() - dt.getTime();
        var mins = Math.floor(diffMs / 60000);
        var hours = Math.floor(mins / 60);
        var days = Math.floor(hours / 24);
        if (days > 7) return dt.getDate() + "/" + (dt.getMonth() + 1) + "/" + dt.getFullYear();
        if (days > 0) return days + "d ago";
        if (hours > 0) return hours + "h ago";
        if (mins > 0) return mins + "m ago";
        return "Just now";
      } catch (e) {
        return "";
      }
    }

    function tileHtml(notif) {
      var type = notif.type;
      var icon = ICONS[type] || "<i class='ph ph-bell'></i>";
      var color = COLORS[type] || "#E91E63";
      var isUnread = notif.is_read === false;
      var title = notif.title || "Notification";
      var subtitle = notif.message || notif.body || "";
      var time = timeAgo(notif);

      return (
        '<div class="n-tile' + (isUnread ? " unread" : "") + '" data-id="' + notif.id + '">' +
        '<div class="n-icon" style="background:' + color + '1A;color:' + color + '">' + icon + "</div>" +
        '<div style="flex:1;min-width:0">' +
        '<div class="n-title-row"><div class="n-title">' + escapeHtml(title) + "</div>" +
        (time ? '<div class="n-time">' + time + "</div>" : "") +
        "</div>" +
        '<div class="n-sub">' + escapeHtml(subtitle) + "</div>" +
        "</div>" +
        (isUnread ? '<div class="n-dot"></div>' : "") +
        "</div>"
      );
    }

    function render() {
      var hasUnread = notifications.some(function (n) { return n.is_read === false; });
      markAllBtn.style.display = hasUnread ? "block" : "none";

      if (notifications.length === 0) {
        listRoot.innerHTML =
          '<div class="state"><div class="state-icon-wrap"><i class="ph ph-bell"></i></div>' +
          '<div class="state-title">No notifications</div>' +
          "<div class=\"state-sub\">You're all caught up!</div></div>";
        return;
      }

      listRoot.innerHTML = notifications.map(tileHtml).join("");
      listRoot.querySelectorAll(".n-tile").forEach(function (tile) {
        tile.addEventListener("click", function () { markAsRead(tile.getAttribute("data-id")); });
      });
    }

    function renderError(message) {
      listRoot.innerHTML =
        '<div class="state error"><div class="state-icon-wrap"><i class="ph ph-warning"></i></div>' +
        '<div class="state-title">Something went wrong</div>' +
        '<div class="state-sub">' + escapeHtml(message) + "</div>" +
        '<button class="retry-btn" id="retryBtn">Retry</button></div>';
      document.getElementById("retryBtn").addEventListener("click", load);
    }

    async function load() {
      listRoot.innerHTML = '<div class="spinner-wrap"><div class="spinner" role="status" aria-label="Loading"></div></div>';
      var token = SessionManager.getToken();
      try {
        var result = await NotificationService.getNotifications(token);
        if (result && result.success === true) {
          var data = result.data;
          notifications = (data && data.notifications) || (Array.isArray(data) ? data : []);
          render();
        } else {
          renderError((result && result.message) || "Failed to load notifications");
        }
      } catch (e) {
        renderError("Something went wrong. Please try again.");
      }
    }

    async function markAsRead(id) {
      var token = SessionManager.getToken();
      await NotificationService.markAsRead(token, id);
      load();
    }

    markAllBtn.addEventListener("click", async function () {
      var token = SessionManager.getToken();
      await NotificationService.markAllAsRead(token);
      load();
    });

    load();
  })();
</script>
</body>
</html>
