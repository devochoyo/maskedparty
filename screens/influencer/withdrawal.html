<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Withdraw — Masked Party</title>
<script src="/widgets/phosphor_icons.js"></script>
<script>PhosphorIcons.load();</script>
<style>
  :root{--primary-pink:#E91E63;--soft-pink:#FF6B8B;--light-pink:#FFE4EC;--bg:#F8F9FE;--card:#fff;--text-dark:#1A1D2E;--text-medium:#6B7280;--text-light:#9CA3AF;--success:#00C853;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text-dark);}
  header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid rgba(255,228,236,.4);}
  .head-row{max-width:520px;margin:0 auto;display:flex;align-items:center;padding:14px 16px;gap:12px;}
  .back-btn{width:34px;height:34px;border:none;background:none;font-size:18px;color:var(--text-dark);cursor:pointer;}
  h1{font-size:20px;font-weight:700;}
  main{max-width:520px;margin:0 auto;padding:20px 16px 40px;}

  .balance-card{padding:18px;border-radius:18px;background:linear-gradient(135deg,var(--primary-pink),var(--soft-pink));color:#fff;text-align:center;box-shadow:0 6px 16px rgba(233,30,99,.3);}
  .balance-card .lab{font-size:12px;opacity:.9;}
  .balance-card .val{margin-top:6px;font-size:30px;font-weight:700;}

  .card{margin-top:16px;background:var(--card);border-radius:18px;padding:18px;border:1px solid rgba(255,228,236,.4);}
  .card-title{font-weight:700;font-size:14px;margin-bottom:12px;}
  .bank-row{display:flex;justify-content:space-between;padding:8px 0;font-size:13px;border-bottom:1px solid #f5f5f5;}
  .bank-row:last-child{border-bottom:none;}
  .bank-row .k{color:var(--text-medium);}
  .bank-row .v{font-weight:600;}

  .bank-field{margin-top:10px;}
  .bank-field input,.bank-field select{width:100%;padding:13px 14px;background:var(--bg);border:1px solid #e5e5e5;border-radius:14px;font-size:14px;color:var(--text-dark);}
  .bank-field input:focus,.bank-field select:focus{outline:none;border-color:var(--primary-pink);}
  .bank-note{font-size:12px;color:var(--text-medium);line-height:1.4;margin-bottom:6px;}
  .amount-wrap{position:relative;margin-top:10px;}
  .amount-wrap input{width:100%;padding:14px 16px 14px 44px;background:var(--bg);border:1px solid #e5e5e5;border-radius:14px;font-size:20px;font-weight:700;color:var(--text-dark);}
  .amount-wrap input:focus{outline:none;border-color:var(--primary-pink);}
  .amount-wrap .prefix{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:18px;color:var(--text-medium);font-weight:700;}
  .error-msg{margin-top:6px;font-size:12px;color:#D32F2F;}

  .submit-btn{margin-top:20px;width:100%;height:52px;border:none;border-radius:16px;background:linear-gradient(to right,var(--primary-pink),var(--soft-pink));color:#fff;font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 5px 15px rgba(233,30,99,.3);}
  .submit-btn:disabled{opacity:.6;cursor:not-allowed;}

  .history-empty{margin-top:12px;padding:28px;text-align:center;background:var(--card);border-radius:16px;border:1px solid rgba(255,228,236,.4);color:var(--text-light);font-size:13px;}
  .history-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #f5f5f5;}
  .history-row:last-child{border-bottom:none;}
  .history-date{font-size:12px;color:var(--text-medium);flex:1;}
  .history-amount{font-size:13px;font-weight:700;}
  .history-badge{padding:4px 10px;border-radius:10px;font-size:10px;font-weight:700;letter-spacing:.3px;margin-left:8px;}

  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9500;display:flex;align-items:center;justify-content:center;padding:24px;}
  .confirm-card{background:#fff;border-radius:24px;padding:24px;max-width:360px;width:100%;}
  .confirm-title{display:flex;align-items:center;gap:12px;font-size:19px;font-weight:700;}
  .confirm-body{margin-top:12px;font-size:14px;color:var(--text-medium);line-height:1.4;}
  .confirm-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;}
  .confirm-actions button{padding:10px 20px;border-radius:12px;font-weight:600;font-size:14px;cursor:pointer;border:none;}
  .confirm-actions .cancel{background:none;color:var(--text-medium);}
  .confirm-actions .confirm{background:var(--primary-pink);color:#fff;}

  .toast{position:fixed;left:16px;right:16px;bottom:24px;background:#D32F2F;color:#fff;padding:14px 16px;border-radius:12px;font-size:14px;text-align:center;max-width:420px;margin:0 auto;z-index:9800;}
  .toast.success{background:var(--success);}
  .spinner-wrap{display:flex;justify-content:center;padding:80px 0;}
  .spinner{width:32px;height:32px;border:3px solid rgba(233,30,99,.2);border-top-color:var(--primary-pink);border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <header><div class="head-row"><button class="back-btn" id="backBtn" aria-label="Back"><i class="ph ph-arrow-left"></i></button><h1>Withdraw</h1></div></header>
  <main id="root"><div class="spinner-wrap"><div class="spinner" role="status" aria-label="Loading"></div></div></main>

<script src="/services/api.js"></script>
<script src="/services/api_endpoints.js"></script>
<script src="/services/session_manager.js"></script>
<script src="/services/route_guard.js"></script>
<script>RouteGuard.require("influencer");</script>
<script src="/services/wallet_service.js"></script>
<script src="/services/profile_service.js"></script>
<script src="/services/withdrawal_service.js"></script>
<script>
  (function () {
    var root = document.getElementById("root");
    document.getElementById("backBtn").addEventListener("click", function () { window.history.back(); });

    var availableBalance = 0, bankName = "", accountNumber = "", accountName = null, history = [];
    var bankCodeType = "", bankCodeValue = "";
    var codeTypes = ["SWIFT", "IBAN", "Sort Code", "IFSC", "BSB", "Routing Number", "Other"];
    var isSubmitting = false;

    function escapeHtml(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }
    function showToast(message, kind) {
      var t = document.createElement("div");
      t.className = "toast" + (kind ? " " + kind : "");
      t.textContent = message;
      document.body.appendChild(t);
      setTimeout(function () { t.remove(); }, 3500);
    }

    function historyRow(item) {
      var amount = parseFloat(item.amount) || 0;
      var status = (item.status || "pending").toString();
      var date = item.created_at || item.date;
      var displayDate = "";
      if (date) { try { var dt = new Date(date); displayDate = dt.getDate() + "/" + (dt.getMonth() + 1) + "/" + dt.getFullYear(); } catch (e) { displayDate = date; } }
      var lower = status.toLowerCase();
      var color = lower === "completed" ? "#00C853" : lower === "pending" ? "#FF9800" : "#D32F2F";

      return (
        '<div class="history-row"><div class="history-date">' + displayDate + "</div>" +
        '<div class="history-amount">' + amount.toFixed(0) + " Coins</div>" +
        '<div class="history-badge" style="background:' + color + '1A;color:' + color + '">' + escapeHtml(status) + "</div></div>"
      );
    }

    function render() {
      root.innerHTML =
        '<div class="balance-card"><div class="lab">Available Balance</div><div class="val">' + availableBalance.toFixed(2) + " Coins</div></div>" +
        '<div class="card"><div class="card-title"><i class="ph ph-bank"></i> Payout Bank Details</div>' +
        '<div class="bank-note">Enter the bank account you want to be paid into. It is saved for your next withdrawal.</div>' +
        '<div class="bank-field"><input type="text" id="bankNameInput" placeholder="Bank Name" autocomplete="off" maxlength="100" value="' + escapeHtml(bankName) + '"></div>' +
        '<div class="bank-field"><input type="text" id="accountNumberInput" placeholder="Account Number" autocomplete="off" inputmode="numeric" maxlength="40" value="' + escapeHtml(accountNumber) + '"></div>' +
        '<div class="bank-field"><select id="codeTypeSelect"><option value="">Select Bank Code Type</option>' +
        codeTypes.map(function (t) { return '<option value="' + t + '"' + (selectedCodeType() === t ? " selected" : "") + ">" + t + "</option>"; }).join("") +
        "</select></div>" +
        '<div class="bank-field" id="customCodeField" style="display:' + (selectedCodeType() === "Other" ? "block" : "none") + '"><input type="text" id="customCodeInput" placeholder="Enter Code Name (e.g. CLABE)" autocomplete="off" maxlength="40" value="' + escapeHtml(customCodeType()) + '"></div>' +
        '<div class="bank-field"><input type="text" id="bankCodeValueInput" placeholder="Enter Code" autocomplete="off" maxlength="60" value="' + escapeHtml(bankCodeValue) + '"></div>' +
        '<div class="bank-row" style="margin-top:12px"><span class="k">Account Name</span><span class="v">' + escapeHtml(accountName || "Not available") + "</span></div>" +
        "</div>" +
        '<div class="card"><div class="card-title"><i class="ph ph-credit-card"></i> Withdraw Coins</div>' +
        '<div class="amount-wrap"><span class="prefix"><i class="ph ph-coins"></i></span><input type="number" id="amountInput" placeholder="0"></div>' +
        '<div class="error-msg" id="amountError" style="display:none"></div>' +
        '<button class="submit-btn" id="submitBtn"><span id="submitLabel">Request Withdrawal</span></button>' +
        "</div>" +
        '<div class="card"><div class="card-title"><i class="ph ph-receipt"></i> Withdrawal History</div>' +
        (history.length === 0
          ? '<div class="history-empty">No withdrawal requests yet</div>'
          : history.map(historyRow).join("")) +
        "</div>";

      document.getElementById("submitBtn").addEventListener("click", requestWithdrawal);
      document.getElementById("codeTypeSelect").addEventListener("change", function (e) {
        document.getElementById("customCodeField").style.display = e.target.value === "Other" ? "block" : "none";
      });
    }

    // Saved code type: one of the list, or a custom name (shown under "Other").
    function selectedCodeType() {
      if (!bankCodeType) return "";
      return codeTypes.indexOf(bankCodeType) >= 0 ? bankCodeType : "Other";
    }
    function customCodeType() {
      return codeTypes.indexOf(bankCodeType) >= 0 ? "" : bankCodeType;
    }

    function requestWithdrawal() {
      var input = document.getElementById("amountInput");
      var errorEl = document.getElementById("amountError");
      var amount = parseFloat(input.value.trim());
      if (!amount || amount <= 0) {
        errorEl.textContent = "Enter a valid amount";
        errorEl.style.display = "block";
        return;
      }
      errorEl.style.display = "none";

      // Bank details are required at withdrawal time.
      var bank = {
        bankName: document.getElementById("bankNameInput").value.trim(),
        accountNumber: document.getElementById("accountNumberInput").value.trim(),
        bankCodeType: document.getElementById("codeTypeSelect").value,
        bankCodeValue: document.getElementById("bankCodeValueInput").value.trim()
      };
      if (bank.bankCodeType === "Other") bank.bankCodeType = document.getElementById("customCodeInput").value.trim();
      if (!bank.bankName || !bank.accountNumber || !bank.bankCodeType || !bank.bankCodeValue) {
        showToast("Please fill in all your bank details");
        return;
      }

      var backdrop = document.createElement("div");
      backdrop.className = "modal-backdrop";
      backdrop.innerHTML =
        '<div class="confirm-card">' +
        '<div class="confirm-title"><i class="ph ph-credit-card"></i> Confirm Withdrawal</div>' +
        '<div class="confirm-body">Are you sure you want to withdraw ' + amount + ' Coins?</div>' +
        '<div class="confirm-actions"><button class="cancel" id="cancelBtn">Cancel</button><button class="confirm" id="confirmBtn">Confirm</button></div>' +
        "</div>";
      document.body.appendChild(backdrop);
      backdrop.addEventListener("click", function (e) { if (e.target === backdrop) backdrop.remove(); });
      backdrop.querySelector("#cancelBtn").addEventListener("click", function () { backdrop.remove(); });
      backdrop.querySelector("#confirmBtn").addEventListener("click", async function () {
        backdrop.remove();
        if (isSubmitting) return;
        isSubmitting = true;
        var btn = document.getElementById("submitBtn");
        var label = document.getElementById("submitLabel");
        btn.disabled = true; label.textContent = "Submitting...";

        var token = SessionManager.getToken();
        try {
          var result = await WithdrawalService.requestWithdrawal(token, amount, bank);
          isSubmitting = false;
          if (result && result.success === true) {
            showToast("Withdrawal request submitted for review", "success");
            input.value = "";
            load();
          } else {
            btn.disabled = false; label.textContent = "Request Withdrawal";
            showToast((result && result.message) || "Failed to submit withdrawal request");
          }
        } catch (e) {
          isSubmitting = false;
          btn.disabled = false; label.textContent = "Request Withdrawal";
          showToast("Something went wrong. Please try again.");
        }
      });
    }

    async function load() {
      root.innerHTML = '<div class="spinner-wrap"><div class="spinner" role="status" aria-label="Loading"></div></div>';
      var token = SessionManager.getToken();
      try {
        var results = await Promise.all([WalletService.getBalance(token), ProfileService.getProfile(token), WithdrawalService.getWithdrawalHistory(token)]);
        var balanceResult = results[0], profileResult = results[1], historyResult = results[2];

        if (balanceResult && balanceResult.success === true) {
          var d = balanceResult.data || {};
          availableBalance = parseFloat(d.available_balance != null ? d.available_balance : (d.current_balance != null ? d.current_balance : d.balance)) || 0;
        }
        if (profileResult && profileResult.success === true) {
          var p = profileResult.data || {};
          bankName = p.bank_name || "";
          accountName = p.full_name;
          accountNumber = p.account_number || "";
          bankCodeType = p.bank_code_type || "";
          bankCodeValue = p.bank_code_value || "";
        }
        if (historyResult && historyResult.success === true) {
          var raw = historyResult.data;
          history = Array.isArray(raw) ? raw : (raw && (raw.history || raw.withdrawals || raw.data)) || [];
        }
        render();
      } catch (e) {
        render();
      }
    }

    load();
  })();
</script>
</body>
</html>
