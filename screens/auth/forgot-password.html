<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Forgot Password — Masked Party</title>
<script src="/widgets/phosphor_icons.js"></script>
<script>PhosphorIcons.load();</script>
<style>
  :root{--primary-pink:#E91E63;--soft-pink:#FF6B8B;--light-pink:#FFE4EC;--dark-pink:#C2185B;--text-dark:#1A1D2E;--text-medium:#6B7280;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;min-height:100dvh;background:linear-gradient(to bottom, var(--primary-pink) 0%, var(--soft-pink) 30%, rgba(255,228,236,.8) 60%, rgba(255,228,236,.3) 100%);position:relative;overflow-x:hidden;}
  .page{position:relative;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px 24px;}
  .col{width:100%;max-width:420px;}
  .back-btn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);border-radius:12px;color:#fff;font-size:18px;text-decoration:none;}
  .head{text-align:center;margin-top:20px;}
  .logo{width:80px;height:80px;margin:0 auto;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:38px;box-shadow:0 8px 20px rgba(194,24,91,.4);}
  h1{margin-top:20px;font-size:26px;font-weight:700;color:#fff;}
  .subtitle{margin-top:8px;font-size:14px;color:#fff;font-weight:500;line-height:1.5;}

  .card{margin-top:32px;background:#fff;border-radius:28px;padding:24px;box-shadow:0 15px 30px rgba(194,24,91,.2);border:1.5px solid rgba(255,255,255,.8);}
  label{display:block;font-size:13px;font-weight:600;color:var(--text-dark);margin-bottom:8px;}
  .field{margin-bottom:20px;}
  input[type=email]{width:100%;padding:14px 16px;background:rgba(255,228,236,.2);border:1px solid rgba(255,228,236,.4);border-radius:14px;font-size:15px;color:var(--text-dark);}
  input:focus{outline:none;border-color:var(--primary-pink);background:#fff;}
  .error-msg{color:#D32F2F;font-size:12px;margin-top:6px;display:none;}
  .field.invalid input{border-color:#D32F2F;background:#FFF5F5;}
  .field.invalid .error-msg{display:block;}

  button.submit{width:100%;height:54px;border:none;border-radius:14px;cursor:pointer;background:linear-gradient(to right,var(--primary-pink),var(--dark-pink));color:#fff;font-size:16px;font-weight:700;box-shadow:0 5px 15px rgba(233,30,99,.4);display:flex;align-items:center;justify-content:center;gap:8px;}
  button.submit:disabled{opacity:.5;cursor:not-allowed;box-shadow:none;background:#9CA3AF;}
  .spinner{width:20px;height:20px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}

  .back-login{display:block;text-align:center;margin-top:22px;color:#fff;font-size:14px;font-weight:600;text-decoration:none;}
  .back-login:hover{text-decoration:underline;}

  .toast{position:fixed;left:16px;right:16px;bottom:24px;background:#D32F2F;color:#fff;padding:14px 16px;border-radius:12px;box-shadow:0 6px 16px rgba(0,0,0,.2);font-size:14px;text-align:center;transform:translateY(120%);transition:transform .25s ease;max-width:420px;margin:0 auto;z-index:20;}
  .toast.show{transform:translateY(0);}
  .toast.success{background:#00C853;}
</style>
</head>
<body>
  <div class="page">
    <div class="col">
      <a href="/login" class="back-btn" aria-label="Back to sign in"><i class="ph ph-arrow-left"></i></a>
      <div class="head">
        <div class="logo" aria-hidden="true"><i class="ph ph-lock-simple"></i></div>
        <h1>Forgot Password?</h1>
        <p class="subtitle">Enter your email and we'll send you a code to reset your password</p>
      </div>

      <form class="card" id="forgotForm" novalidate>
        <div class="field" id="emailField">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="email" required>
          <div class="error-msg">Enter a valid email address</div>
        </div>
        <button type="submit" class="submit" id="submitBtn"><span id="submitLabel">Send Reset Code</span></button>
      </form>

      <a href="/login" class="back-login">Back to Sign In</a>
    </div>
  </div>

  <div class="toast" id="toast" role="alert" aria-live="assertive"></div>

<script src="/services/api.js"></script>
<script src="/services/api_endpoints.js"></script>
<script src="/services/session_manager.js"></script>
<script src="/services/auth_service.js"></script>
<script>
  (function () {
    var form = document.getElementById("forgotForm");
    var emailInput = document.getElementById("email");
    var submitBtn = document.getElementById("submitBtn");
    var submitLabel = document.getElementById("submitLabel");
    var toast = document.getElementById("toast");
    var toastTimer = null;

    function showToast(message, kind) {
      toast.textContent = message;
      toast.className = "toast show" + (kind ? " " + kind : "");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toast.className = "toast"; }, 3500);
    }

    function setLoading(loading) {
      submitBtn.disabled = loading;
      submitLabel.innerHTML = loading ? "" : "Send Reset Code";
      if (loading) {
        var s = document.createElement("span");
        s.className = "spinner";
        submitLabel.appendChild(s);
      }
    }

    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      var emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailInput.value.trim());
      document.getElementById("emailField").classList.toggle("invalid", !emailOk);
      if (!emailOk) return;

      setLoading(true);
      try {
        var result = await AuthService.forgotPassword(emailInput.value.trim());
        if (result && result.success === true) {
          showToast("Reset code sent to your email.", "success");
          setTimeout(function () {
            window.location.href = "/reset-password?email=" + encodeURIComponent(emailInput.value.trim());
          }, 900);
        } else {
          showToast((result && result.message) || "Could not send reset code.");
          setLoading(false);
        }
      } catch (err) {
        showToast("Something went wrong. Please try again.");
        setLoading(false);
      }
    });
  })();
</script>
</body>
</html>
