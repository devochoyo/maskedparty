<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Sign In — Masked Party</title>
<script src="/widgets/phosphor_icons.js"></script>
<script>PhosphorIcons.load();</script>
<style>
  :root{
    --primary-pink:#E91E63;
    --soft-pink:#FF6B8B;
    --light-pink:#FFE4EC;
    --dark-pink:#C2185B;
    --text-dark:#1A1D2E;
    --text-medium:#6B7280;
    --text-light:#9CA3AF;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    min-height:100dvh;
    background:linear-gradient(to bottom, var(--primary-pink) 0%, var(--soft-pink) 30%, rgba(255,228,236,0.8) 60%, rgba(255,228,236,0.3) 100%);
    position:relative;overflow-x:hidden;
  }
  .deco{position:absolute;border-radius:50%;background:rgba(255,255,255,.08);pointer-events:none;}
  .deco.d1{width:150px;height:150px;top:60px;right:-40px;background:rgba(255,255,255,.1);}
  .deco.d2{width:100px;height:100px;top:150px;left:-30px;}
  .deco.d3{width:80px;height:80px;bottom:100px;right:-20px;background:rgba(255,255,255,.06);}

  .page{position:relative;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px 24px;}
  .col{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;}

  .logo{width:80px;height:80px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:42px;box-shadow:0 8px 20px rgba(194,24,91,0.4);}
  h1{margin-top:20px;font-size:28px;font-weight:700;color:#fff;text-align:center;}
  .subtitle{margin-top:6px;font-size:14px;color:rgba(255,255,255,.9);text-align:center;}

  .form-card{
    width:100%;margin-top:30px;
    background:#fff;border-radius:24px;padding:24px;
    box-shadow:0 10px 30px rgba(194,24,91,0.2);
  }
  label{display:block;font-size:13px;font-weight:600;color:var(--text-dark);margin-bottom:6px;}
  .field{margin-bottom:18px;position:relative;}
  input[type=email], input[type=password], input[type=text]{
    width:100%;padding:16px;padding-right:44px;
    background:var(--light-pink);border:1px solid transparent;border-radius:14px;
    font-size:15px;color:var(--text-dark);
    transition:border-color .15s ease, background .15s ease;
  }
  input:focus{outline:none;border-color:var(--primary-pink);background:#fff;}
  .field .icon-btn{
    position:absolute;right:10px;top:38px;
    background:none;border:none;cursor:pointer;color:var(--text-light);font-size:18px;padding:6px;
  }
  .error-msg{color:#D32F2F;font-size:12px;margin-top:6px;display:none;}
  .field.invalid input{border-color:#D32F2F;background:#FFF5F5;}
  .field.invalid .error-msg{display:block;}

  .forgot-row{text-align:right;margin-bottom:12px;}
  .forgot-row a{color:var(--primary-pink);font-weight:600;font-size:12px;text-decoration:none;}
  .forgot-row a:hover{text-decoration:underline;}

  button.submit{
    width:100%;height:54px;border:none;border-radius:14px;cursor:pointer;
    background:linear-gradient(to right, var(--primary-pink), var(--dark-pink));
    color:#fff;font-size:16px;font-weight:700;letter-spacing:.3px;
    box-shadow:0 5px 15px rgba(233,30,99,.4);
    display:flex;align-items:center;justify-content:center;gap:8px;
    transition:opacity .15s ease, transform .15s ease;
  }
  button.submit:disabled{opacity:.6;cursor:not-allowed;box-shadow:none;background:#9CA3AF;}
  button.submit:active:not(:disabled){transform:scale(0.99);}
  button.submit:focus-visible{outline:3px solid #fff;outline-offset:2px}

  .spinner{width:20px;height:20px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}

  .register-box{
    width:100%;margin-top:24px;padding:14px 16px;
    background:#fff;border-radius:16px;border:1.5px solid rgba(255,255,255,.8);
    box-shadow:0 4px 10px rgba(194,24,91,0.15);
    display:flex;align-items:center;justify-content:center;gap:4px;
    font-size:14px;color:var(--text-dark);
  }
  .register-box a{color:var(--primary-pink);font-weight:700;text-decoration:none;}
  .register-box a:hover{text-decoration:underline;}

  .toast{
    position:fixed;left:16px;right:16px;bottom:24px;
    background:#D32F2F;color:#fff;padding:14px 16px;border-radius:12px;
    box-shadow:0 6px 16px rgba(0,0,0,.2);
    font-size:14px;text-align:center;
    transform:translateY(120%);transition:transform .25s ease;
    max-width:420px;margin:0 auto;z-index:20;
  }
  .toast.show{transform:translateY(0);}
  .toast.warn{background:#F57C00;}
  @media (max-width:360px){ h1{font-size:24px} .form-card{padding:20px} }
</style>
</head>
<body>
  <div class="deco d1"></div>
  <div class="deco d2"></div>
  <div class="deco d3"></div>

  <div class="page">
    <div class="col">
      <div class="logo" aria-hidden="true"><i class="ph ph-mask-happy"></i></div>
      <h1>Welcome Back</h1>
      <p class="subtitle">Sign in to continue to MaskedParty</p>

      <form class="form-card" id="loginForm" novalidate>
        <div class="field" id="emailField">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
          <div class="error-msg">Enter a valid email address</div>
        </div>

        <div class="field" id="passwordField">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
          <button type="button" class="icon-btn" id="togglePassword" aria-label="Show password"><i class="ph ph-eye"></i></button>
          <div class="error-msg">Password is required</div>
        </div>

        <div class="forgot-row"><a href="/forgot-password">Forgot Password?</a></div>

        <button type="submit" class="submit" id="submitBtn">
          <span id="submitLabel">Sign In <i class="ph ph-arrow-right"></i></span>
        </button>
      </form>

      <div class="register-box">
        <span>Don't have an account?</span>
        <a href="/role">Register</a>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="alert" aria-live="assertive"></div>

<script src="/services/api.js"></script>
<script src="/services/api_endpoints.js"></script>
<script src="/services/session_manager.js"></script>
<script src="/services/auth_service.js"></script>
<script>
  (function () {
    // If already logged in, don't show the login form at all.
    if (SessionManager.isLoggedIn()) {
      AuthService.routeAfterLogin(SessionManager.getToken(), SessionManager.getRole());
    }

    var form = document.getElementById("loginForm");
    var emailInput = document.getElementById("email");
    var passwordInput = document.getElementById("password");
    var submitBtn = document.getElementById("submitBtn");
    var submitLabel = document.getElementById("submitLabel");
    var toast = document.getElementById("toast");
    var toastTimer = null;

    document.getElementById("togglePassword").addEventListener("click", function () {
      var showing = passwordInput.type === "text";
      passwordInput.type = showing ? "password" : "text";
      this.innerHTML = showing ? '<i class="ph ph-eye"></i>' : '<i class="ph ph-eye-slash"></i>';
      this.setAttribute("aria-label", showing ? "Show password" : "Hide password");
    });

    function showToast(message, kind) {
      toast.textContent = message;
      toast.className = "toast show" + (kind === "warn" ? " warn" : "");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toast.className = "toast"; }, 4000);
    }

    function setFieldError(fieldId, hasError) {
      document.getElementById(fieldId).classList.toggle("invalid", hasError);
    }

    function validate() {
      var emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailInput.value.trim());
      var passwordOk = passwordInput.value.length > 0;
      setFieldError("emailField", !emailOk);
      setFieldError("passwordField", !passwordOk);
      return emailOk && passwordOk;
    }

    function setLoading(loading) {
      submitBtn.disabled = loading;
      submitLabel.innerHTML = loading ? "" : "Sign In <i class='ph ph-arrow-right'></i>";
      if (loading) {
        var spinner = document.createElement("span");
        spinner.className = "spinner";
        submitLabel.appendChild(spinner);
      }
    }

    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      if (!validate()) return;

      setLoading(true);
      try {
        var result = await AuthService.login(emailInput.value.trim(), passwordInput.value);

        if (!result || result.success === false) {
          throw new Error((result && result.message) || "Login failed");
        }
        if (!result.token) {
          throw new Error("Login succeeded but no auth token was returned.");
        }

        await AuthService.routeAfterLogin(result.token, result.role);
      } catch (err) {
        showToast(err.message || "Login failed");
        setLoading(false);
      }
    });
  })();
</script>
</body>
</html>
