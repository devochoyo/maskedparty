<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Masked Party — Welcome</title>
<style>
  :root{
    --primary-pink:#E91E63;
    --dark-pink:#C2185B;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    min-height:100dvh;
    position:relative;
    overflow:hidden;
    background:#0d0508;
  }
  /*
    On a phone-width viewport the hero fills the whole screen, matching the
    original app exactly. On wider viewports (tablet/desktop) the portrait
    photo would distort badly if stretched full-bleed, so it's presented in
    a centered phone-proportioned frame instead, with a softly blurred copy
    of the same image filling the backdrop — the frontend-design equivalent
    of how a phone screenshot is usually shown on a marketing site.
  */
  .backdrop{
    position:fixed;inset:0;
    background:url('/assets/masked_party.png') center 20%/cover no-repeat;
    filter:blur(40px) brightness(.5) saturate(1.1);
    transform:scale(1.15);
    z-index:0;
  }
  .stage{
    position:relative;z-index:1;
    width:100%;max-width:480px;
    height:100dvh;margin:0 auto;
    background:url('/assets/masked_party.png') center top/cover no-repeat;
    box-shadow:0 0 80px rgba(0,0,0,.5);
  }
  .scrim{
    position:absolute;inset:0;
    background:linear-gradient(to top, rgba(0,0,0,.55) 0%, rgba(0,0,0,0) 30%);
  }
  .cta{
    position:absolute;
    left:20px;right:20px;bottom:max(40px, env(safe-area-inset-bottom) + 24px);
  }
  .cta button{
    width:100%;height:56px;
    background:var(--primary-pink);
    color:#fff;border:none;border-radius:16px;
    font-size:16px;font-weight:700;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(0,0,0,.35);
    transition:transform .15s ease, background .15s ease;
  }
  .cta button:hover{background:var(--dark-pink)}
  .cta button:active{transform:scale(0.98)}
  .cta button:focus-visible{outline:3px solid #fff;outline-offset:2px}
</style>
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>
  <div class="stage">
    <div class="scrim" aria-hidden="true"></div>
    <div class="cta">
      <button id="getStartedBtn" type="button">Get Started</button>
    </div>
  </div>

<script>
  document.getElementById("getStartedBtn").addEventListener("click", function () {
    window.location.href = "/client-home";
  });
</script>
</body>
</html>
