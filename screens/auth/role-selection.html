<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Choose Your Role — Masked Party</title>
<script src="/widgets/phosphor_icons.js"></script>
<script>PhosphorIcons.load();</script>
<style>
  :root{
    --primary-pink:#E91E63;
    --soft-pink:#FF6B8B;
    --light-pink:#FFE4EC;
    --dark-pink:#C2185B;
    --text-dark:#1A1D2E;
    --text-medium:#6B7280;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    min-height:100dvh;
    background:linear-gradient(to bottom, var(--primary-pink) 0%, var(--soft-pink) 30%, rgba(255,228,236,0.8) 60%, rgba(255,228,236,0.3) 100%);
    position:relative;
    overflow-x:hidden;
  }
  .deco{position:absolute;border-radius:50%;background:rgba(255,255,255,.08);pointer-events:none;}
  .deco.d1{width:150px;height:150px;top:60px;right:-40px;background:rgba(255,255,255,.1);}
  .deco.d2{width:100px;height:100px;top:150px;left:-30px;}
  .deco.d3{width:80px;height:80px;bottom:100px;right:-20px;background:rgba(255,255,255,.06);}

  .page{
    position:relative;
    min-height:100dvh;
    display:flex;align-items:center;justify-content:center;
    padding:20px 24px;
  }
  .card-col{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;text-align:center;}

  .back-btn{
    align-self:flex-start;
    width:40px;height:40px;
    display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.2);
    border:1px solid rgba(255,255,255,.3);
    border-radius:12px;color:#fff;font-size:18px;
    cursor:pointer;text-decoration:none;
  }
  .back-btn:focus-visible{outline:2px solid #fff;outline-offset:2px}

  .logo{
    margin-top:20px;
    width:80px;height:80px;border-radius:50%;background:#fff;
    display:flex;align-items:center;justify-content:center;font-size:42px;
    box-shadow:0 8px 20px rgba(194,24,91,0.4);
  }
  h1{margin-top:20px;font-size:30px;font-weight:700;color:#fff;letter-spacing:-.5px;}
  .subtitle{margin-top:6px;font-size:15px;color:#fff;font-weight:500;}

  .roles{width:100%;margin-top:50px;display:flex;flex-direction:column;gap:16px;}
  .role-card{
    width:100%;
    display:flex;align-items:center;gap:16px;
    background:#fff;border:1.5px solid rgba(255,255,255,.8);
    border-radius:24px;padding:20px;
    box-shadow:0 8px 20px rgba(194,24,91,0.2);
    cursor:pointer;text-align:left;
    text-decoration:none;color:inherit;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .role-card:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(194,24,91,0.28);}
  .role-card:focus-visible{outline:2px solid var(--primary-pink);outline-offset:2px}
  .role-icon{
    width:60px;height:60px;border-radius:18px;flex:none;
    display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;
    box-shadow:0 5px 12px rgba(233,30,99,.3);
  }
  .role-icon.client{background:linear-gradient(135deg,var(--primary-pink),var(--soft-pink));}
  .role-icon.influencer{background:linear-gradient(135deg,var(--dark-pink),var(--primary-pink));}
  .role-title{font-size:17px;font-weight:700;color:var(--text-dark);letter-spacing:.2px;}
  .role-sub{margin-top:4px;font-size:13px;color:var(--text-medium);line-height:1.3;}
  .role-arrow{margin-left:auto;flex:none;width:32px;height:32px;border-radius:10px;background:rgba(233,30,99,.08);display:flex;align-items:center;justify-content:center;color:rgba(233,30,99,.6);}

  .footer{
    margin-top:35px;padding:8px 16px;
    background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);
    border-radius:20px;color:#fff;font-size:14px;font-weight:500;
  }
  .footer a{color:#fff;font-weight:700;text-decoration:underline;}
  @media (max-width:360px){ h1{font-size:26px} }
</style>
</head>
<body>
  <div class="deco d1"></div>
  <div class="deco d2"></div>
  <div class="deco d3"></div>

  <div class="page">
    <div class="card-col">
      <a href="/login" class="back-btn" aria-label="Back to sign in"><i class="ph ph-arrow-left"></i></a>
      <div class="logo" aria-hidden="true"><i class="ph ph-mask-happy"></i></div>
      <h1>Choose Your Role</h1>
      <p class="subtitle">Select how you want to join MaskedParty</p>

      <div class="roles">
        <a href="/register/client" class="role-card">
          <span class="role-icon client" aria-hidden="true"><i class="ph ph-user"></i></span>
          <span>
            <span class="role-title">Continue as a Client</span>
            <span class="role-sub" style="display:block">Connect and have private video calls with creators</span>
          </span>
          <span class="role-arrow" aria-hidden="true"><i class="ph ph-caret-right"></i></span>
        </a>
        <a href="/register/influencer" class="role-card">
          <span class="role-icon influencer" aria-hidden="true"><i class="ph-fill ph-star"></i></span>
          <span>
            <span class="role-title">Continue as an Influencer</span>
            <span class="role-sub" style="display:block">Earn by connecting with clients through video calls</span>
          </span>
          <span class="role-arrow" aria-hidden="true"><i class="ph ph-caret-right"></i></span>
        </a>
      </div>

      <div class="footer">Already have an account? <a href="/login">Sign In</a></div>
    </div>
  </div>
</body>
</html>
