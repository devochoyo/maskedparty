<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Customer Support — Masked Party</title>
<script src="/widgets/phosphor_icons.js"></script>
<script>PhosphorIcons.load();</script>
<style>
  :root{--primary-pink:#E91E63;--text-dark:#1A1D2E;--text-light:#9e9e9e;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#F0EDF2;color:var(--text-dark);display:flex;flex-direction:column;height:100dvh;overflow:hidden;}
  header{flex:none;background:#fff;box-shadow:0 .5px 0 rgba(0,0,0,.06);}
  .head-row{display:flex;align-items:center;gap:10px;padding:12px;}
  .back-btn{width:34px;height:34px;border:none;background:none;font-size:18px;color:var(--text-dark);cursor:pointer;flex:none;}
  .head-title{font-weight:600;font-size:15px;}
  .head-agent{font-size:11px;color:var(--text-light);}

  main{flex:1;overflow-y:auto;padding:10px 12px 6px;}
  .bubble-row{display:flex;margin-bottom:8px;}
  .bubble-row.mine{justify-content:flex-end;}
  .bubble{max-width:75%;padding:10px 14px;border-radius:18px 18px 18px 4px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.04);}
  .bubble-row.mine .bubble{border-radius:18px 18px 4px 18px;background:linear-gradient(135deg,#E91E63,#FF6B8B);}
  .bubble-text{font-size:14px;line-height:1.4;color:var(--text-dark);}
  .bubble-row.mine .bubble-text{color:#fff;font-weight:500;}
  .bubble-meta{margin-top:3px;font-size:10px;color:var(--text-light);}
  .bubble-row.mine .bubble-meta{color:rgba(255,255,255,.7);}

  .state{display:flex;flex-direction:column;align-items:center;text-align:center;padding:80px 24px;}
  .state-icon-wrap{width:80px;height:80px;border-radius:50%;background:rgba(233,30,99,.08);display:flex;align-items:center;justify-content:center;font-size:36px;}
  .state-title{margin-top:16px;font-weight:600;font-size:15px;}
  .state-sub{margin-top:6px;font-size:13px;color:var(--text-light);}

  footer{flex:none;background:#fff;padding:8px 8px calc(8px + env(safe-area-inset-bottom)) 12px;}
  .ended-banner{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;background:#F0EDF2;border-radius:22px;font-size:13px;color:#888;font-weight:500;margin-bottom:8px;}
  .support-btn{width:100%;height:48px;border-radius:14px;font-weight:600;font-size:14px;cursor:pointer;margin-bottom:8px;display:flex;align-items:center;justify-content:center;gap:8px;}
  .support-btn.solid{background:var(--primary-pink);color:#fff;border:none;}
  .support-btn.outline{background:#fff;color:var(--primary-pink);border:1.5px solid var(--primary-pink);}
  .input-row{display:flex;align-items:flex-end;gap:8px;}
  .msg-input-wrap{flex:1;background:#F0EDF2;border-radius:22px;max-height:110px;overflow-y:auto;}
  .msg-input-wrap textarea{width:100%;border:none;background:none;outline:none;resize:none;padding:10px 16px;font-size:14px;color:var(--text-dark);font-family:inherit;max-height:110px;}
  .send-btn{width:42px;height:42px;border-radius:50%;border:none;background:#e0e0e0;color:#fff;font-size:16px;cursor:pointer;flex:none;}
  .send-btn.active{background:var(--primary-pink);}

  .spinner-wrap{display:flex;justify-content:center;padding:80px 0;}
  .spinner{width:32px;height:32px;border:3px solid rgba(233,30,99,.2);border-top-color:var(--primary-pink);border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .toast{position:fixed;left:16px;right:16px;bottom:80px;background:#D32F2F;color:#fff;padding:12px 16px;border-radius:12px;font-size:13px;text-align:center;max-width:420px;margin:0 auto;z-index:9800;}
</style>
</head>
<body>
  <header>
    <div class="head-row">
      <button class="back-btn" id="backBtn" aria-label="Back"><i class="ph ph-arrow-left"></i></button>
      <div><div class="head-title">Customer Support</div><div class="head-agent" id="headAgent"></div></div>
    </div>
  </header>
  <main id="messagesRoot"><div class="spinner-wrap"><div class="spinner" role="status" aria-label="Loading"></div></div></main>
  <footer id="footer" style="display:none">
    <div class="input-row">
      <div class="msg-input-wrap"><textarea id="msgInput" rows="1" placeholder="Type your message..."></textarea></div>
      <button class="send-btn" id="sendBtn" aria-label="Send" disabled><i class="ph ph-paper-plane-right"></i></button>
    </div>
  </footer>

<script src="/services/api.js"></script>
<script src="/services/api_endpoints.js"></script>
<script src="/services/session_manager.js"></script>
<script src="/services/route_guard.js"></script>
<script>RouteGuard.require();</script>
<script src="/services/support_service.js"></script>
<script>
  (function () {
    var messagesRoot = document.getElementById("messagesRoot");
    var footer = document.getElementById("footer");

    var messages = [];
    var conversationId = null;
    var conversationStatus = null;
    var assignedAgentName = null;
    var needsSurvey = false;
    var startingNewConversation = false;
    var isSending = false;
    var poller = null;

    document.getElementById("backBtn").addEventListener("click", function () { window.history.back(); });

    function escapeHtml(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }
    function formatTime(dateStr) {
      if (!dateStr) return "";
      try {
        var dt = new Date(dateStr);
        var h = dt.getHours(); var m = String(dt.getMinutes()).padStart(2, "0");
        var ampm = h >= 12 ? "PM" : "AM"; h = h % 12; if (h === 0) h = 12;
        return h + ":" + m + " " + ampm;
      } catch (e) { return ""; }
    }
    function showToast(message) {
      var t = document.createElement("div");
      t.className = "toast";
      t.textContent = message;
      document.body.appendChild(t);
      setTimeout(function () { t.remove(); }, 3200);
    }

    function renderHeader() {
      document.getElementById("headAgent").textContent = assignedAgentName || "";
    }

    function renderMessages() {
      if (messages.length === 0) {
        messagesRoot.innerHTML =
          '<div class="state"><div class="state-icon-wrap"><i class="ph ph-headset"></i></div>' +
          '<div class="state-title">How can we help?</div>' +
          '<div class="state-sub">Send us a message and our team will respond shortly.</div></div>';
        return;
      }
      messagesRoot.innerHTML = messages.map(function (msg) {
        var mine = msg.sender_type === "customer";
        return (
          '<div class="bubble-row' + (mine ? " mine" : "") + '"><div class="bubble">' +
          '<div class="bubble-text">' + escapeHtml(msg.message || "") + "</div>" +
          '<div class="bubble-meta">' + formatTime(msg.created_at) + (msg.status === "sending" ? " · sending…" : "") + "</div>" +
          "</div></div>"
        );
      }).join("");
      messagesRoot.scrollTop = messagesRoot.scrollHeight;
    }

    function renderFooter() {
      footer.style.display = "block";
      var isEnded = !startingNewConversation && conversationStatus === "ended";
      if (isEnded) {
        footer.innerHTML =
          '<div class="ended-banner"><i class="ph ph-lock-simple"></i> This conversation has ended</div>' +
          (needsSurvey ? '<button class="support-btn solid" id="rateBtn"><i class="ph-fill ph-star"></i> Rate Customer Care</button>' : "") +
          '<button class="support-btn outline" id="newConvoBtn"><i class="ph-bold ph-plus"></i> Start New Conversation</button>';
        var rateBtn = document.getElementById("rateBtn");
        if (rateBtn) rateBtn.addEventListener("click", function () { window.location.href = "/rate-support?conversation_id=" + (conversationId || 0); });
        document.getElementById("newConvoBtn").addEventListener("click", startNewConversation);
      } else {
        footer.innerHTML =
          '<div class="input-row">' +
          '<div class="msg-input-wrap"><textarea id="msgInput" rows="1" placeholder="Type your message..."></textarea></div>' +
          '<button class="send-btn" id="sendBtn" aria-label="Send" disabled><i class="ph ph-paper-plane-right"></i></button>' +
          "</div>";
        wireInput();
      }
    }

    function wireInput() {
      var input = document.getElementById("msgInput");
      var btn = document.getElementById("sendBtn");
      input.addEventListener("input", function () {
        input.style.height = "auto";
        input.style.height = Math.min(input.scrollHeight, 110) + "px";
        btn.disabled = !input.value.trim() || isSending;
        btn.classList.toggle("active", !!input.value.trim() && !isSending);
      });
      input.addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
      btn.addEventListener("click", send);
    }

    function startNewConversation() {
      startingNewConversation = true;
      conversationId = null; conversationStatus = null; assignedAgentName = null; needsSurvey = false;
      messages = [];
      renderHeader(); renderMessages(); renderFooter();
    }

    async function send() {
      var input = document.getElementById("msgInput");
      var text = input.value.trim();
      if (!text || isSending) return;
      var token = SessionManager.getToken();

      var optimistic = { id: "temp_" + Date.now(), message: text, sender_type: "customer", created_at: new Date().toISOString(), status: "sending" };
      messages.push(optimistic);
      isSending = true;
      input.value = ""; input.style.height = "auto";
      renderMessages();

      try {
        var result = conversationId == null
          ? await SupportService.contactSupport(token, text)
          : await SupportService.sendMessage(token, conversationId, text);
        isSending = false;
        if (result && result.success === true) {
          if (startingNewConversation) startingNewConversation = false;
          await loadConversation(true);
        } else {
          messages = messages.filter(function (m) { return m.id !== optimistic.id; });
          renderMessages();
          showToast((result && result.message) || "Failed to send message");
        }
      } catch (e) {
        isSending = false;
        messages = messages.filter(function (m) { return m.id !== optimistic.id; });
        renderMessages();
        showToast("Failed to send message");
      }
    }

    async function loadConversation(silent) {
      if (startingNewConversation) return;
      var token = SessionManager.getToken();
      if (!silent) messagesRoot.innerHTML = '<div class="spinner-wrap"><div class="spinner" role="status" aria-label="Loading"></div></div>';

      var result = await SupportService.getMyConversation(token);
      if (startingNewConversation) return;

      if (result && result.success === true && result.data) {
        var data = result.data;
        var conversation = data.conversation;
        var msgs = Array.isArray(data.messages) ? data.messages : [];

        if (conversation) {
          conversationId = conversation.id;
          conversationStatus = conversation.status;
          assignedAgentName = conversation.agent_name;
          needsSurvey = conversation.needs_survey === true;
        } else {
          conversationId = null; conversationStatus = null; assignedAgentName = null; needsSurvey = false;
        }
        messages = msgs;
        renderHeader(); renderMessages(); renderFooter();
      } else if (!silent) {
        renderHeader(); renderMessages(); renderFooter();
      }
    }

    loadConversation(false);
    poller = setInterval(function () { loadConversation(true); }, 3000);
    window.addEventListener("beforeunload", function () { clearInterval(poller); });
  })();
</script>
</body>
</html>
