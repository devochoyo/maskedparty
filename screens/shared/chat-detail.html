<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chat — Masked Party</title>
<script src="/widgets/phosphor_icons.js"></script>
<script>PhosphorIcons.load();</script>
<style>
  :root{--primary-pink:#E91E63;--soft-pink:#FF6B8B;--light-pink:#FFE4EC;--bg:#F8F9FE;--text-dark:#1A1D2E;--text-medium:#6B7280;--text-light:#9CA3AF;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text-dark);display:flex;flex-direction:column;height:100dvh;overflow:hidden;}

  header{flex:none;background:#fff;border-bottom:1px solid rgba(255,228,236,.4);}
  .head-row{display:flex;align-items:center;gap:10px;padding:10px 12px;}
  .back-btn{width:34px;height:34px;border:none;background:none;font-size:18px;color:var(--text-dark);cursor:pointer;flex:none;}
  .head-avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,var(--primary-pink),var(--soft-pink));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;flex:none;}
  .head-name{font-weight:700;font-size:15px;}
  .head-status{font-size:11px;color:var(--text-light);}
  .head-status.online{color:#00C853;}

  main{flex:1;overflow-y:auto;padding:10px 12px 6px;}
  .date-sep{text-align:center;margin:10px 0;font-size:11px;color:var(--text-light);font-weight:600;}
  .bubble-row{display:flex;margin-bottom:8px;}
  .bubble-row.mine{justify-content:flex-end;}
  .bubble{max-width:75%;padding:10px 14px;border-radius:18px 18px 18px 4px;background:#fff;border:.5px solid rgba(255,228,236,.4);box-shadow:0 1px 4px rgba(0,0,0,.04);}
  .bubble-row.mine .bubble{border-radius:18px 18px 4px 18px;background:linear-gradient(135deg,var(--primary-pink),var(--soft-pink));border:none;box-shadow:0 2px 6px rgba(233,30,99,.2);}
  .bubble.failed{background:#FFEBEE;border-color:transparent;}
  .bubble-text{font-size:14px;line-height:1.4;color:var(--text-dark);}
  .bubble-row.mine .bubble-text{color:#fff;font-weight:500;}
  .bubble.failed .bubble-text{color:#C62828;}
  .bubble-meta{margin-top:3px;display:flex;align-items:center;gap:4px;font-size:10px;color:var(--text-light);}
  .bubble-row.mine .bubble-meta{color:rgba(255,255,255,.7);}
  .mini-spin{width:9px;height:9px;border:1.5px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}

  .state{display:flex;flex-direction:column;align-items:center;text-align:center;padding:80px 24px;}
  .state-icon-wrap{width:80px;height:80px;border-radius:50%;background:rgba(233,30,99,.08);display:flex;align-items:center;justify-content:center;font-size:36px;}
  .state-title{margin-top:16px;font-weight:600;font-size:15px;}

  footer{flex:none;background:#fff;border-top:1px solid rgba(255,228,236,.4);padding:8px 8px calc(8px + env(safe-area-inset-bottom)) 12px;display:flex;align-items:flex-end;gap:8px;}
  .msg-input-wrap{flex:1;background:var(--bg);border:1px solid rgba(255,228,236,.4);border-radius:22px;max-height:110px;overflow-y:auto;}
  .msg-input-wrap textarea{width:100%;border:none;background:none;outline:none;resize:none;padding:10px 16px;font-size:14px;color:var(--text-dark);font-family:inherit;max-height:110px;}
  .send-btn{width:42px;height:42px;border-radius:50%;border:none;background:#e0e0e0;color:#fff;font-size:16px;cursor:pointer;flex:none;}
  .send-btn.active{background:linear-gradient(135deg,var(--primary-pink),var(--soft-pink));}

  .spinner-wrap{display:flex;justify-content:center;padding:80px 0;}
  .spinner{width:32px;height:32px;border:3px solid rgba(233,30,99,.2);border-top-color:var(--primary-pink);border-radius:50%;animation:spin .8s linear infinite;}

  .retry-toast{position:fixed;left:16px;right:16px;bottom:80px;background:#D32F2F;color:#fff;padding:12px 16px;border-radius:12px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:420px;margin:0 auto;z-index:9800;}
  .retry-toast button{background:none;border:none;color:#fff;font-weight:700;font-size:13px;cursor:pointer;flex:none;}
</style>
</head>
<body>
  <header>
    <div class="head-row">
      <button class="back-btn" id="backBtn" aria-label="Back"><i class="ph ph-arrow-left"></i></button>
      <div class="head-avatar" id="headAvatar">?</div>
      <div><div class="head-name" id="headName">User</div><div class="head-status" id="headStatus"></div></div>
    </div>
  </header>
  <main id="messagesRoot">
    <div class="spinner-wrap"><div class="spinner" role="status" aria-label="Loading"></div></div>
  </main>
  <footer>
    <div class="msg-input-wrap"><textarea id="msgInput" rows="1" placeholder="Message..."></textarea></div>
    <button class="send-btn" id="sendBtn" aria-label="Send" disabled><i class="ph ph-paper-plane-right"></i></button>
  </footer>

<script src="/services/api.js"></script>
<script src="/services/api_endpoints.js"></script>
<script src="/services/session_manager.js"></script>
<script src="/services/route_guard.js"></script>
<script>RouteGuard.require();</script>
<script src="/services/chat_service.js"></script>
<script>
  (function () {
    var otherUserId = window.location.pathname.replace(/^\/chat\//, "").split("?")[0].split("/")[0];
    var params = new URLSearchParams(window.location.search);
    var otherUserName = params.get("name") || "User";
    var otherUserPhoto = params.get("photo") || null;

    var messagesRoot = document.getElementById("messagesRoot");
    var msgInput = document.getElementById("msgInput");
    var sendBtn = document.getElementById("sendBtn");
    var myUserId = null;
    var messages = [];
    var isSending = false;
    var poller = null;

    document.getElementById("backBtn").addEventListener("click", function () { window.history.back(); });
    document.getElementById("headName").textContent = otherUserName;
    var headAvatar = document.getElementById("headAvatar");
    if (otherUserPhoto) {
      headAvatar.outerHTML = '<img class="head-avatar" id="headAvatar" src="' + otherUserPhoto + '" alt="">';
    } else {
      headAvatar.textContent = otherUserName ? otherUserName.charAt(0).toUpperCase() : "?";
    }

    function escapeHtml(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }

    function formatTime(dateStr) {
      if (!dateStr) return "";
      try {
        var dt = new Date(dateStr);
        var h = dt.getHours(); var m = String(dt.getMinutes()).padStart(2, "0");
        var ampm = h >= 12 ? "PM" : "AM";
        h = h % 12; if (h === 0) h = 12;
        return h + ":" + m + " " + ampm;
      } catch (e) { return ""; }
    }

    function isSameDay(a, b) {
      if (!a || !b) return false;
      try {
        var da = new Date(a), db = new Date(b);
        return da.getFullYear() === db.getFullYear() && da.getMonth() === db.getMonth() && da.getDate() === db.getDate();
      } catch (e) { return false; }
    }

    var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    function dateSeparatorLabel(dateStr) {
      if (!dateStr) return "";
      try {
        var dt = new Date(dateStr);
        var now = new Date();
        var yest = new Date(now); yest.setDate(now.getDate() - 1);
        if (isSameDay(dateStr, now.toISOString())) return "Today";
        if (isSameDay(dateStr, yest.toISOString())) return "Yesterday";
        return MONTHS[dt.getMonth()] + " " + dt.getDate() + (dt.getFullYear() !== now.getFullYear() ? ", " + dt.getFullYear() : "");
      } catch (e) { return ""; }
    }

    function isMine(msg) {
      return myUserId != null && String(msg.sender_id) === String(myUserId);
    }

    function render() {
      if (messages.length === 0) {
        messagesRoot.innerHTML = '<div class="state"><div class="state-icon-wrap"><i class="ph ph-chat-circle"></i></div><div class="state-title">Say hello 👋</div></div>';
        return;
      }
      var html = "";
      messages.forEach(function (msg, i) {
        var prev = i > 0 ? messages[i - 1] : null;
        if (i === 0 || !isSameDay(msg.created_at, prev ? prev.created_at : null)) {
          html += '<div class="date-sep">' + dateSeparatorLabel(msg.created_at) + "</div>";
        }
        var mine = isMine(msg);
        var failed = msg.failed === true;
        var sending = msg.sending === true;
        html +=
          '<div class="bubble-row' + (mine ? " mine" : "") + '"><div class="bubble' + (failed ? " failed" : "") + '">' +
          '<div class="bubble-text">' + escapeHtml(msg.message || "") + "</div>" +
          '<div class="bubble-meta"><span>' + formatTime(msg.created_at) + "</span>" +
          (mine && sending ? '<span class="mini-spin"></span>' : "") +
          (failed ? "<span><i class='ph ph-warning'></i></span>" : "") +
          "</div></div></div>";
      });
      messagesRoot.innerHTML = html;
      messagesRoot.scrollTop = messagesRoot.scrollHeight;
    }

    function updateSendBtn() {
      var has = msgInput.value.trim().length > 0;
      sendBtn.disabled = !has || isSending;
      sendBtn.classList.toggle("active", has && !isSending);
    }

    msgInput.addEventListener("input", function () {
      msgInput.style.height = "auto";
      msgInput.style.height = Math.min(msgInput.scrollHeight, 110) + "px";
      updateSendBtn();
    });
    msgInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
    });
    sendBtn.addEventListener("click", send);

    function showRetryToast(text) {
      var toast = document.createElement("div");
      toast.className = "retry-toast";
      toast.innerHTML = '<span>Failed to send message</span><button id="retryBtn">Retry</button>';
      document.body.appendChild(toast);
      toast.querySelector("#retryBtn").addEventListener("click", function () {
        toast.remove();
        messages = messages.filter(function (m) { return !m.failed; });
        msgInput.value = text;
        updateSendBtn();
        send();
      });
      setTimeout(function () { toast.remove(); }, 5000);
    }

    async function send() {
      var text = msgInput.value.trim();
      if (!text || isSending) return;
      var token = SessionManager.getToken();

      var tempId = "temp_" + Date.now();
      var optimistic = { id: tempId, sender_id: myUserId, receiver_id: otherUserId, message: text, created_at: new Date().toISOString(), sending: true };
      messages.push(optimistic);
      isSending = true;
      msgInput.value = "";
      msgInput.style.height = "auto";
      updateSendBtn();
      render();

      var result = await ChatService.sendMessage(token, otherUserId, text);
      isSending = false;
      updateSendBtn();

      var idx = messages.findIndex(function (m) { return m.id === tempId; });
      if (result && result.success === true) {
        if (idx !== -1) {
          messages[idx] = {
            id: (result.data && result.data.message_id) || tempId,
            sender_id: myUserId, receiver_id: otherUserId, message: text, created_at: new Date().toISOString(),
          };
        }
        render();
        loadMessages(true);
      } else {
        if (idx !== -1) messages[idx].failed = true;
        render();
        showRetryToast(text);
      }
    }

    async function loadMessages(silent) {
      var token = SessionManager.getToken();
      if (!silent) messagesRoot.innerHTML = '<div class="spinner-wrap"><div class="spinner" role="status" aria-label="Loading"></div></div>';
      var result = await ChatService.getMessages(token, otherUserId);
      if (result && result.success === true) {
        var data = result.data;
        var list = Array.isArray(data) ? data : (data && (data.messages || data.data || data.chats || data.items)) || [];
        // Keep any still-pending optimistic messages that haven't landed yet
        var pending = messages.filter(function (m) { return String(m.id).indexOf("temp_") === 0; });
        messages = list.concat(pending);
        var status = data && data.online_status;
        var statusEl = document.getElementById("headStatus");
        if (status === "online") { statusEl.textContent = "Online"; statusEl.classList.add("online"); }
        else { statusEl.textContent = ""; statusEl.classList.remove("online"); }
        render();
      }
    }

    async function init() {
      var user = SessionManager.getUser();
      myUserId = user && user.id != null ? String(user.id) : null;
      await loadMessages(false);
    }

    init();
    poller = setInterval(function () { loadMessages(true); }, 2000);
    window.addEventListener("beforeunload", function () { clearInterval(poller); });
  })();
</script>
</body>
</html>
