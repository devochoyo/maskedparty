<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saved Influencers — Masked Party</title>
<script src="/widgets/phosphor_icons.js"></script>
<script>PhosphorIcons.load();</script>
<style>
  :root{--primary-pink:#E91E63;--soft-pink:#FF6B8B;--light-pink:#FFE4EC;--bg:#F8F9FE;--text-dark:#1A1D2E;--text-medium:#6B7280;--text-light:#9CA3AF;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text-dark);}
  header{position:sticky;top:0;z-index:10;background:#fff;box-shadow:0 1px 0 rgba(0,0,0,.02);}
  .head-row{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:center;position:relative;padding:14px 16px;}
  .back-btn{position:absolute;left:16px;width:34px;height:34px;border:none;background:none;font-size:18px;color:var(--text-dark);cursor:pointer;}
  h1{font-size:20px;font-weight:700;}
  .accent-line{height:2px;background:linear-gradient(90deg,var(--primary-pink),var(--soft-pink));}

  main{max-width:560px;margin:0 auto;padding:16px;}

  .s-card{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#fff,rgba(255,228,236,.3));border:1.5px solid rgba(233,30,99,.25);border-radius:20px;padding:14px;margin-bottom:14px;box-shadow:0 4px 12px rgba(233,30,99,.1);cursor:pointer;}
  .s-avatar-wrap{position:relative;width:56px;height:56px;flex:none;padding:3px;border-radius:50%;background:linear-gradient(135deg,var(--primary-pink),var(--soft-pink));}
  .s-avatar{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid #fff;background:var(--light-pink);display:flex;align-items:center;justify-content:center;color:var(--primary-pink);font-size:22px;}
  .s-online{position:absolute;bottom:1px;right:1px;width:13px;height:13px;border-radius:50%;background:#00C853;border:2px solid #fff;}
  .s-name{font-weight:700;font-size:16px;letter-spacing:-.2px;}
  .s-loc{margin-top:4px;font-size:13px;color:var(--text-medium);display:flex;align-items:center;gap:4px;}
  .unsave-btn{margin-left:auto;flex:none;width:38px;height:38px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--primary-pink),var(--soft-pink));color:#fff;font-size:16px;cursor:pointer;}

  .state{display:flex;flex-direction:column;align-items:center;text-align:center;padding:80px 24px;}
  .state-icon-wrap{width:90px;height:90px;border-radius:50%;background:rgba(233,30,99,.08);display:flex;align-items:center;justify-content:center;font-size:40px;}
  .state-title{margin-top:18px;font-weight:700;font-size:17px;}
  .state-sub{margin-top:6px;font-size:14px;color:var(--text-medium);}
  .retry-btn{margin-top:20px;padding:10px 20px;border-radius:12px;border:1.5px solid var(--primary-pink);background:#fff;color:var(--primary-pink);font-weight:700;font-size:14px;cursor:pointer;}

  .spinner-wrap{display:flex;justify-content:center;padding:80px 0;}
  .spinner{width:32px;height:32px;border:3px solid rgba(233,30,99,.2);border-top-color:var(--primary-pink);border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <header>
    <div class="head-row"><button class="back-btn" id="backBtn" aria-label="Back"><i class="ph ph-arrow-left"></i></button><h1>Saved Influencers</h1></div>
    <div class="accent-line"></div>
  </header>
  <main id="root"><div class="spinner-wrap"><div class="spinner" role="status" aria-label="Loading"></div></div></main>

<script src="/services/api.js"></script>
<script src="/services/api_endpoints.js"></script>
<script src="/services/session_manager.js"></script>
<script src="/services/route_guard.js"></script>
<script>RouteGuard.require();</script>
<script src="/services/client_service.js"></script>
<script>
  (function () {
    var root = document.getElementById("root");
    document.getElementById("backBtn").addEventListener("click", function () { window.history.back(); });

    function escapeHtml(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }

    function cardHtml(inf) {
      var id = String(inf.id);
      var name = inf.mystery_name || "Unknown";
      var photo = inf.profile_photo;
      var country = inf.country_name;
      var online = inf.online_status === "online" || inf.online_status === 1 || inf.online_status === true;

      return (
        '<div class="s-card" data-id="' + id + '">' +
        '<div class="s-avatar-wrap">' +
        (photo ? '<img class="s-avatar" src="' + photo + '" alt="">' : '<div class="s-avatar"><i class="ph ph-user"></i></div>') +
        (online ? '<span class="s-online"></span>' : "") +
        "</div>" +
        '<div style="flex:1;min-width:0"><div class="s-name">' + escapeHtml(name) + "</div>" +
        (country ? '<div class="s-loc"><i class="ph ph-map-pin"></i> ' + escapeHtml(country) + "</div>" : "") + "</div>" +
        '<button class="unsave-btn" data-unsave="' + id + '" aria-label="Remove from saved"><i class="ph-fill ph-bookmark-simple"></i></button>' +
        "</div>"
      );
    }

    function render(list) {
      if (list.length === 0) {
        root.innerHTML =
          '<div class="state"><div class="state-icon-wrap"><i class="ph-fill ph-bookmark-simple"></i></div>' +
          '<div class="state-title">No saved influencers</div>' +
          '<div class="state-sub">Influencers you save will show up here.</div></div>';
        return;
      }
      root.innerHTML = list.map(cardHtml).join("");
      root.querySelectorAll(".s-card").forEach(function (card) {
        card.addEventListener("click", function (e) {
          if (e.target.closest("[data-unsave]")) return;
          window.location.href = "/influencer/" + card.getAttribute("data-id");
        });
      });
      root.querySelectorAll("[data-unsave]").forEach(function (btn) {
        btn.addEventListener("click", function (e) {
          e.stopPropagation();
          unsave(btn.getAttribute("data-unsave"));
        });
      });
    }

    function renderError(message) {
      root.innerHTML =
        '<div class="state"><div class="state-icon-wrap"><i class="ph ph-warning"></i></div>' +
        '<div class="state-title">Something went wrong</div>' +
        '<div class="state-sub">' + escapeHtml(message) + "</div>" +
        '<button class="retry-btn" id="retryBtn">Retry</button></div>';
      document.getElementById("retryBtn").addEventListener("click", load);
    }

    async function unsave(id) {
      var token = SessionManager.getToken();
      var result = await ClientService.removeSavedInfluencer(token, id);
      if (result && result.success === true) {
        load();
      } else {
        showToast((result && result.message) || "Failed to remove");
      }
    }
    function showToast(message) {
      var t = document.createElement("div");
      t.style.cssText = "position:fixed;left:16px;right:16px;bottom:24px;background:#D32F2F;color:#fff;padding:14px 16px;border-radius:12px;font-size:14px;text-align:center;max-width:420px;margin:0 auto;z-index:9800;";
      t.textContent = message;
      document.body.appendChild(t);
      setTimeout(function () { t.remove(); }, 3200);
    }

    async function load() {
      root.innerHTML = '<div class="spinner-wrap"><div class="spinner" role="status" aria-label="Loading"></div></div>';
      var token = SessionManager.getToken();
      try {
        var result = await ClientService.getSavedInfluencers(token);
        if (result && result.success === true) {
          var data = result.data;
          var list = Array.isArray(data) ? data : (data && (data.influencers || data.saved)) || [];
          render(list);
        } else {
          renderError((result && result.message) || "Could not load saved influencers.");
        }
      } catch (e) {
        renderError("Something went wrong. Please try again.");
      }
    }

    load();
  })();
</script>
</body>
</html>
