<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Transaction History — Masked Party</title>
<script src="/widgets/phosphor_icons.js"></script>
<script>PhosphorIcons.load();</script>
<style>
  :root{--primary-pink:#E91E63;--soft-pink:#FF6B8B;--bg:#F8F9FE;--text-dark:#1A1D2E;--text-medium:#6B7280;--text-light:#9CA3AF;--success:#00C853;--spend:#FF2D63;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text-dark);}
  header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid rgba(255,228,236,.4);}
  .head-row{max-width:560px;margin:0 auto;display:flex;align-items:center;padding:14px 16px;gap:12px;}
  .back-btn{width:34px;height:34px;border:none;background:none;font-size:18px;color:var(--text-dark);cursor:pointer;}
  h1{font-size:20px;font-weight:700;}

  .filters{max-width:560px;margin:0 auto;display:flex;gap:8px;padding:12px 16px 0;}
  .chip{padding:8px 16px;border-radius:20px;border:1.5px solid rgba(255,228,236,.7);background:#fff;font-size:13px;font-weight:600;color:var(--text-medium);cursor:pointer;}
  .chip.active{background:linear-gradient(135deg,var(--primary-pink),var(--soft-pink));border-color:transparent;color:#fff;}

  main{max-width:560px;margin:0 auto;padding:16px;}
  .day-label{font-size:12px;font-weight:700;color:var(--text-light);text-transform:uppercase;letter-spacing:.4px;margin:16px 0 8px;}
  .tx-list{background:#fff;border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.04);overflow:hidden;}
  .tx-item{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid #f5f5f5;}
  .tx-item:last-child{border-bottom:none;}
  .tx-ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none;}
  .tx-desc{font-weight:600;font-size:13px;}
  .tx-date{font-size:11px;color:var(--text-light);margin-top:2px;}
  .tx-value{margin-left:auto;font-weight:700;font-size:13px;flex:none;}
  .tx-value.credit{color:var(--success);}
  .tx-value.debit{color:var(--spend);}

  .state{display:flex;flex-direction:column;align-items:center;text-align:center;padding:70px 24px;}
  .state-icon-wrap{width:80px;height:80px;border-radius:50%;background:rgba(233,30,99,.08);display:flex;align-items:center;justify-content:center;font-size:36px;}
  .retry-btn{margin-top:20px;padding:10px 20px;border-radius:12px;border:none;background:var(--primary-pink);color:#fff;font-weight:700;font-size:14px;cursor:pointer;}
  .spinner-wrap{display:flex;justify-content:center;padding:70px 0;}
  .spinner{width:32px;height:32px;border:3px solid rgba(233,30,99,.2);border-top-color:var(--primary-pink);border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <header>
    <div class="head-row"><button class="back-btn" id="backBtn" aria-label="Back"><i class="ph ph-arrow-left"></i></button><h1>Transaction History</h1></div>
    <div class="filters">
      <button class="chip active" data-filter="all">All</button>
      <button class="chip" data-filter="purchase">Purchases</button>
      <button class="chip" data-filter="spend">Spend</button>
    </div>
  </header>
  <main id="root"><div class="spinner-wrap"><div class="spinner" role="status" aria-label="Loading"></div></div></main>

<script src="/services/api.js"></script>
<script src="/services/api_endpoints.js"></script>
<script src="/services/session_manager.js"></script>
<script src="/services/route_guard.js"></script>
<script>RouteGuard.require();</script>
<script src="/services/wallet_service.js"></script>
<script>
  (function () {
    var root = document.getElementById("root");
    var transactions = [];
    var filter = "all";
    document.getElementById("backBtn").addEventListener("click", function () { window.history.back(); });

    function escapeHtml(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }
    var CREDIT_TYPES = ["purchase", "credit", "refund", "coin_purchase", "wallet_funding", "escrow_release", "received"];
    function isCredit(tx) { return CREDIT_TYPES.indexOf(tx.type || "") !== -1; }

    function formatRelative(dateStr) {
      if (!dateStr) return "";
      try {
        var dt = new Date(dateStr);
        var diffMs = Date.now() - dt.getTime();
        var mins = Math.floor(diffMs / 60000), hours = Math.floor(mins / 60), days = Math.floor(hours / 24);
        if (days > 7) return dt.getDate() + "/" + (dt.getMonth() + 1) + "/" + dt.getFullYear();
        if (days > 0) return days + "d ago";
        if (hours > 0) return hours + "h ago";
        if (mins > 0) return mins + "m ago";
        return "Just now";
      } catch (e) { return dateStr; }
    }

    function txRow(tx) {
      var credit = isCredit(tx);
      var coins = Math.abs(parseFloat(tx.coins) || 0);
      var amount = Math.abs(parseFloat(tx.amount) || 0);
      var description = tx.description || (credit ? "Coins purchased" : "Coins spent");
      var date = tx.created_at || tx.date || "";
      var displayValue = coins > 0
        ? (credit ? "+" : "-") + Math.trunc(coins) + " Coins"
        : amount > 0 ? (credit ? "+" : "-") + amount.toFixed(2) : "0 Coins";

      return (
        '<div class="tx-item">' +
        '<div class="tx-ic" style="background:' + (credit ? "rgba(0,200,83,.1);color:#00C853" : "rgba(255,45,99,.1);color:#FF2D63") + '">' + (credit ? "<i class='ph ph-arrow-down'></i>" : "<i class='ph ph-arrow-up'></i>") + "</div>" +
        '<div><div class="tx-desc">' + escapeHtml(description) + '</div><div class="tx-date">' + formatRelative(date) + "</div></div>" +
        '<div class="tx-value ' + (credit ? "credit" : "debit") + '">' + displayValue + "</div>" +
        "</div>"
      );
    }

    function filtered() {
      if (filter === "all") return transactions;
      return transactions.filter(function (tx) { return filter === "purchase" ? isCredit(tx) : !isCredit(tx); });
    }

    function render() {
      var list = filtered();
      if (list.length === 0) {
        root.innerHTML =
          '<div class="state"><div class="state-icon-wrap"><i class="ph ph-receipt"></i></div>' +
          '<div style="margin-top:16px;font-weight:700">' + (filter === "all" ? "No transactions yet" : "No " + (filter === "purchase" ? "purchases" : "spends") + " found") + "</div></div>";
        return;
      }
      root.innerHTML = '<div class="tx-list">' + list.map(txRow).join("") + "</div>";
    }

    function renderError(message) {
      root.innerHTML =
        '<div class="state"><div class="state-icon-wrap"><i class="ph ph-warning"></i></div>' +
        '<div style="margin-top:16px;font-weight:700">Something went wrong</div>' +
        '<div style="margin-top:6px;font-size:13px;color:var(--text-medium)">' + escapeHtml(message) + "</div>" +
        '<button class="retry-btn" id="retryBtn">Retry</button></div>';
      document.getElementById("retryBtn").addEventListener("click", load);
    }

    document.querySelectorAll(".chip").forEach(function (chip) {
      chip.addEventListener("click", function () {
        document.querySelectorAll(".chip").forEach(function (c) { c.classList.remove("active"); });
        chip.classList.add("active");
        filter = chip.getAttribute("data-filter");
        render();
      });
    });

    async function load() {
      root.innerHTML = '<div class="spinner-wrap"><div class="spinner" role="status" aria-label="Loading"></div></div>';
      var token = SessionManager.getToken();
      try {
        var result = await WalletService.getHistory(token, { limit: 100 });
        if (result && result.success === true) {
          var d = result.data;
          transactions = Array.isArray(d) ? d : (d && (d.transactions || d.history || d.data)) || [];
          render();
        } else {
          renderError((result && result.message) || "Failed to load transactions");
        }
      } catch (e) {
        renderError("Request timed out. Please try again.");
      }
    }

    load();
  })();
</script>
</body>
</html>
