<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Edit Profile — Masked Party</title>
<script src="/widgets/phosphor_icons.js"></script>
<script>PhosphorIcons.load();</script>
<style>
  :root{--primary-pink:#E91E63;--soft-pink:#FF6B8B;--light-pink:#FFE4EC;--bg:#F8F9FE;--text-dark:#1A1D2E;--text-medium:#6B7280;--text-light:#9CA3AF;--success:#00C853;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text-dark);}

  header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid rgba(255,228,236,.4);}
  .head-row{max-width:520px;margin:0 auto;display:flex;align-items:center;padding:14px 16px;gap:12px;}
  .back-btn{width:34px;height:34px;border:none;background:none;font-size:18px;color:var(--text-dark);cursor:pointer;}
  h1{font-size:20px;font-weight:700;}

  main{max-width:520px;margin:0 auto;padding:24px 20px 40px;}

  .photo-wrap{display:flex;flex-direction:column;align-items:center;}
  .photo-ring{position:relative;width:110px;height:110px;border-radius:50%;padding:3px;background:linear-gradient(135deg,var(--primary-pink),var(--soft-pink));}
  .photo{width:100%;height:100%;border-radius:50%;background:#fff;padding:3px;}
  .photo img,.photo .fb{width:100%;height:100%;border-radius:50%;object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:40px;color:rgba(233,30,99,.4);background:linear-gradient(135deg,rgba(255,228,236,.5),#fff);}
  .photo-edit-btn{position:absolute;bottom:2px;right:2px;width:32px;height:32px;border-radius:50%;background:var(--primary-pink);border:3px solid #fff;color:#fff;font-size:14px;cursor:pointer;}
  .photo-uploading{position:absolute;inset:0;border-radius:50%;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;}
  .mini-spin{width:22px;height:22px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}

  .field{margin-top:24px;}
  label{display:block;font-size:13px;font-weight:600;margin-bottom:8px;}
  input[type=text],input[type=email]{width:100%;padding:14px 16px;background:#fff;border:1px solid rgba(255,228,236,.6);border-radius:14px;font-size:15px;color:var(--text-dark);}
  input:disabled{background:var(--bg);color:var(--text-light);}
  input:focus{outline:none;border-color:var(--primary-pink);}
  .hint{margin-top:6px;font-size:12px;color:var(--text-light);}

  .save-btn{margin-top:32px;width:100%;height:54px;border:none;border-radius:16px;background:linear-gradient(to right,var(--primary-pink),var(--soft-pink));color:#fff;font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 5px 15px rgba(233,30,99,.3);display:flex;align-items:center;justify-content:center;gap:8px;}
  .save-btn:disabled{opacity:.6;cursor:not-allowed;}

  .toast{position:fixed;left:16px;right:16px;bottom:24px;background:#D32F2F;color:#fff;padding:14px 16px;border-radius:12px;font-size:14px;text-align:center;max-width:420px;margin:0 auto;z-index:9800;}
  .toast.success{background:var(--success);}
  .spinner-wrap{display:flex;justify-content:center;padding:80px 0;}
  .spinner{width:32px;height:32px;border:3px solid rgba(233,30,99,.2);border-top-color:var(--primary-pink);border-radius:50%;animation:spin .8s linear infinite;}
</style>
</head>
<body>
  <header>
    <div class="head-row">
      <button class="back-btn" id="backBtn" aria-label="Back"><i class="ph ph-arrow-left"></i></button>
      <h1>Edit Profile</h1>
    </div>
  </header>
  <main id="root">
    <div class="spinner-wrap"><div class="spinner" role="status" aria-label="Loading"></div></div>
  </main>

<script src="/services/api.js"></script>
<script src="/services/api_endpoints.js"></script>
<script src="/services/session_manager.js"></script>
<script src="/services/route_guard.js"></script>
<script>RouteGuard.require();</script>
<script src="/services/profile_service.js"></script>
<script src="/services/upload_service.js"></script>
<script>
  (function () {
    var root = document.getElementById("root");
    document.getElementById("backBtn").addEventListener("click", function () { window.history.back(); });

    var profilePhotoUrl = null;

    function showToast(message, kind) {
      var t = document.createElement("div");
      t.className = "toast" + (kind ? " " + kind : "");
      t.textContent = message;
      document.body.appendChild(t);
      setTimeout(function () { t.remove(); }, 3200);
    }

    function renderForm(profile) {
      var name = profile.mystery_name || "";
      var email = profile.email || "";
      var country = profile.country_name || "";
      profilePhotoUrl = profile.profile_photo || null;

      root.innerHTML =
        '<div class="photo-wrap"><div class="photo-ring" id="photoRing">' +
        '<div class="photo">' + (profilePhotoUrl ? '<img src="' + profilePhotoUrl + '" alt="" id="photoImg">' : '<div class="fb" id="photoImg"><i class="ph ph-user"></i></div>') + "</div>" +
        '<button class="photo-edit-btn" id="pickPhotoBtn" aria-label="Change photo"><i class="ph ph-pencil-simple"></i></button>' +
        "</div></div>" +
        '<input type="file" accept="image/*" id="photoInput" style="display:none">' +
        '<div class="field"><label for="nameInput">Mystery Name</label><input type="text" id="nameInput" value="' + escapeAttr(name) + '"></div>' +
        '<div class="field"><label for="emailInput">Email</label><input type="email" id="emailInput" value="' + escapeAttr(email) + '" disabled><div class="hint">Email can\'t be changed here.</div></div>' +
        '<div class="field"><label for="countryInput">Country</label><input type="text" id="countryInput" value="' + escapeAttr(country) + '" disabled><div class="hint">Country can\'t be changed here.</div></div>' +
        '<button class="save-btn" id="saveBtn"><span id="saveLabel">Save Changes</span></button>';

      document.getElementById("pickPhotoBtn").addEventListener("click", function () {
        document.getElementById("photoInput").click();
      });
      document.getElementById("photoInput").addEventListener("change", onPickPhoto);
      document.getElementById("saveBtn").addEventListener("click", saveProfile);
    }

    function escapeAttr(s) {
      return String(s == null ? "" : s).replace(/"/g, "&quot;");
    }

    async function onPickPhoto(e) {
      var file = e.target.files[0];
      if (!file) return;
      var ring = document.getElementById("photoRing");
      var overlay = document.createElement("div");
      overlay.className = "photo-uploading";
      overlay.innerHTML = '<div class="mini-spin"></div>';
      ring.appendChild(overlay);

      // preview immediately
      var reader = new FileReader();
      reader.onload = function () { document.getElementById("photoImg").outerHTML = '<img src="' + reader.result + '" alt="" id="photoImg">'; };
      reader.readAsDataURL(file);

      var token = SessionManager.getToken();
      var result = await UploadService.uploadProfilePhoto(token, file);
      overlay.remove();

      if (result && result.success === true && result.data && result.data.url) {
        profilePhotoUrl = result.data.url;
        showToast("Photo uploaded successfully", "success");
      } else {
        showToast("Failed to upload photo");
      }
    }

    async function saveProfile() {
      var name = document.getElementById("nameInput").value.trim();
      if (!name) { showToast("Mystery Name is required"); return; }

      var btn = document.getElementById("saveBtn");
      var label = document.getElementById("saveLabel");
      btn.disabled = true;
      label.textContent = "Saving...";

      var token = SessionManager.getToken();
      var data = { mystery_name: name };
      if (profilePhotoUrl) data.profile_photo = profilePhotoUrl;

      var result = await ProfileService.updateProfile(token, data);
      btn.disabled = false;
      label.textContent = "Save Changes";

      if (result && result.success === true) {
        showToast("Profile updated successfully", "success");
        setTimeout(function () { window.history.back(); }, 800);
      } else {
        showToast((result && result.message) || "Update failed");
      }
    }

    async function load() {
      var token = SessionManager.getToken();
      var result = await ProfileService.getProfile(token);
      if (result && result.success === true) {
        renderForm(result.data || {});
      } else {
        renderForm({});
      }
    }

    load();
  })();
</script>
</body>
</html>
