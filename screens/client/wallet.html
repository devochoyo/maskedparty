<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wallet — Masked Party</title>
<script src="/widgets/phosphor_icons.js"></script>
<script>PhosphorIcons.load();</script>
<style>
  :root{--primary-pink:#E91E63;--soft-pink:#FF6B8B;--bg:#F8F9FE;--text-dark:#1A1D2E;--text-medium:#6B7280;--text-light:#9CA3AF;--success:#00C853;--spend:#FF2D63;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text-dark);}

  header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid rgba(255,228,236,.4);}
  .head-row{max-width:560px;margin:0 auto;display:flex;align-items:center;padding:14px 16px;gap:12px;}
  .back-btn{width:34px;height:34px;border:none;background:none;font-size:18px;color:var(--text-dark);cursor:pointer;}
  h1{flex:1;font-size:20px;font-weight:700;}
  .add-btn{width:36px;height:36px;border-radius:10px;background:rgba(233,30,99,.1);border:none;color:var(--primary-pink);font-size:18px;cursor:pointer;}

  main{max-width:560px;margin:0 auto;padding:20px;}

  .error-banner{margin-bottom:16px;padding:12px;background:rgba(211,47,47,.1);border-radius:12px;color:#D32F2F;font-size:13px;}

  .balance-card{padding:20px;border-radius:16px;background:linear-gradient(135deg,var(--spend),var(--soft-pink));color:#fff;display:flex;justify-content:space-between;align-items:flex-start;}
  .balance-label{font-size:13px;color:rgba(255,255,255,.75);font-weight:500;}
  .balance-value{margin-top:6px;font-size:32px;font-weight:700;}
  .balance-value span{font-size:16px;font-weight:600;}
  .buy-btn{margin-top:12px;height:32px;padding:0 16px;border-radius:20px;border:none;background:#fff;color:var(--primary-pink);font-weight:700;font-size:12px;cursor:pointer;}
  .coin-icon{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:30px;}

  .stats-row{margin-top:16px;display:flex;gap:12px;}
  .stat-card{flex:1;background:#fff;border-radius:14px;padding:14px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.04);}
  .stat-ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none;}
  .stat-val{font-weight:700;font-size:15px;}
  .stat-lab{font-size:11px;color:var(--text-medium);}

  .section-row{margin-top:24px;display:flex;justify-content:space-between;align-items:center;}
  .section-row h2{font-size:16px;font-weight:700;}
  .view-all{border:none;background:none;color:var(--primary-pink);font-weight:600;font-size:13px;cursor:pointer;}

  .tx-empty{margin-top:12px;padding:32px 0;text-align:center;color:var(--text-light);}
  .tx-empty .ic{width:56px;height:56px;margin:0 auto;border-radius:50%;background:rgba(233,30,99,.1);display:flex;align-items:center;justify-content:center;font-size:24px;}
  .tx-list{margin-top:12px;background:#fff;border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.04);overflow:hidden;}
  .tx-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid #f5f5f5;}
  .tx-item:last-child{border-bottom:none;}
  .tx-ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;flex:none;}
  .tx-desc{font-weight:600;font-size:13px;}
  .tx-date{font-size:11px;color:var(--text-light);margin-top:2px;}
  .tx-value{margin-left:auto;font-weight:700;font-size:13px;flex:none;}
  .tx-value.credit{color:var(--success);}
  .tx-value.debit{color:var(--spend);}

  .spinner-wrap{display:flex;justify-content:center;padding:80px 0;}
  .spinner{width:32px;height:32px;border:3px solid rgba(233,30,99,.2);border-top-color:var(--primary-pink);border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <header>
    <div class="head-row">
      <button class="back-btn" id="backBtn" aria-label="Back"><i class="ph ph-arrow-left"></i></button>
      <h1>Wallet</h1>
      <button class="add-btn" id="addBtn" aria-label="Buy coins"><i class="ph-bold ph-plus"></i></button>
    </div>
  </header>
  <main id="root">
    <div class="spinner-wrap"><div class="spinner" role="status" aria-label="Loading"></div></div>
  </main>

<script src="/services/api.js"></script>
<script src="/services/api_endpoints.js"></script>
<script src="/services/session_manager.js"></script>
<script src="/services/route_guard.js"></script>
<script>RouteGuard.require();</script>
<script src="/services/wallet_service.js"></script>
<script>
  (function () {
    var root = document.getElementById("root");
    document.getElementById("backBtn").addEventListener("click", function () { window.history.back(); });
    document.getElementById("addBtn").addEventListener("click", function () { window.location.href = "/buy-coins"; });

    function escapeHtml(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }

    function formatRelative(dateStr) {
      if (!dateStr) return "";
      try {
        var dt = new Date(dateStr);
        var diffMs = Date.now() - dt.getTime();
        var mins = Math.floor(diffMs / 60000), hours = Math.floor(mins / 60), days = Math.floor(hours / 24);
        if (days > 7) return dt.getDate() + "/" + (dt.getMonth() + 1) + "/" + dt.getFullYear();
        if (days > 0) return days + "d ago";
        if (hours > 0) return hours + "h ago";
        if (mins > 0) return mins + "m ago";
        return "Just now";
      } catch (e) { return dateStr; }
    }

    var CREDIT_TYPES = ["purchase", "credit", "refund", "coin_purchase", "wallet_funding", "escrow_release", "received"];

    function txRow(tx) {
      var type = tx.type || "";
      var isCredit = CREDIT_TYPES.indexOf(type) !== -1;
      var coins = Math.abs(parseFloat(tx.coins) || 0);
      var amount = Math.abs(parseFloat(tx.amount) || 0);
      var description = tx.description || (isCredit ? "Coins purchased" : "Coins spent");
      var date = tx.created_at || tx.date || "";
      var displayValue = coins > 0
        ? (isCredit ? "+" : "-") + Math.trunc(coins) + " Coins"
        : amount > 0
          ? (isCredit ? "+" : "-") + amount.toFixed(2)
          : "0 Coins";

      return (
        '<div class="tx-item">' +
        '<div class="tx-ic" style="background:' + (isCredit ? "rgba(0,200,83,.1);color:#00C853" : "rgba(255,45,99,.1);color:#FF2D63") + '">' + (isCredit ? "<i class='ph ph-arrow-down'></i>" : "<i class='ph ph-arrow-up'></i>") + "</div>" +
        '<div><div class="tx-desc">' + escapeHtml(description) + '</div><div class="tx-date">' + formatRelative(date) + "</div></div>" +
        '<div class="tx-value ' + (isCredit ? "credit" : "debit") + '">' + displayValue + "</div>" +
        "</div>"
      );
    }

    function render(balanceData, history, error) {
      var balance = (balanceData && (balanceData.available_balance != null ? balanceData.available_balance : balanceData.current_balance)) || 0;
      balance = parseFloat(balance) || 0;
      var totalSpent = balanceData ? balanceData.total_spent : null;
      var totalPurchased = balanceData ? balanceData.total_purchased : null;

      root.innerHTML =
        (error ? '<div class="error-banner"><i class="ph ph-warning"></i> ' + escapeHtml(error) + "</div>" : "") +
        '<div class="balance-card">' +
        '<div><div class="balance-label">Available Coins</div>' +
        '<div class="balance-value">' + (balance % 1 === 0 ? balance.toFixed(0) : balance.toFixed(2)) + " <span>Coins</span></div>" +
        '<button class="buy-btn" id="buyBtn">Buy Coins</button></div>' +
        '<div class="coin-icon"><i class="ph ph-coins"></i></div>' +
        "</div>" +
        ((totalSpent != null || totalPurchased != null)
          ? '<div class="stats-row">' +
            '<div class="stat-card"><div class="stat-ic" style="background:rgba(255,45,99,.1);color:#FF2D63"><i class="ph ph-trend-up"></i></div><div><div class="stat-val">' + (totalSpent || 0) + '</div><div class="stat-lab">Total Spent</div></div></div>' +
            '<div class="stat-card"><div class="stat-ic" style="background:rgba(0,200,83,.1);color:#00C853"><i class="ph ph-shopping-cart-simple"></i></div><div><div class="stat-val">' + (totalPurchased || 0) + '</div><div class="stat-lab">Total Purchased</div></div></div>' +
            "</div>"
          : "") +
        '<div class="section-row"><h2>Recent Transactions</h2><button class="view-all" id="viewAllBtn">View All <i class="ph ph-caret-right"></i></button></div>' +
        (history.length === 0
          ? '<div class="tx-empty"><div class="ic"><i class="ph ph-receipt"></i></div><div style="margin-top:10px">No transactions yet</div></div>'
          : '<div class="tx-list">' + history.map(txRow).join("") + "</div>");

      document.getElementById("buyBtn").addEventListener("click", function () { window.location.href = "/buy-coins"; });
      document.getElementById("viewAllBtn").addEventListener("click", function () { window.location.href = "/transaction-history"; });
    }

    async function load() {
      var token = SessionManager.getToken();
      try {
        var results = await Promise.all([WalletService.getBalance(token), WalletService.getHistory(token, { limit: 5 })]);
        var balanceResult = results[0], historyResult = results[1];
        var balanceData = balanceResult && balanceResult.success === true ? balanceResult.data : null;
        var history = [];
        if (historyResult && historyResult.success === true) {
          var d = historyResult.data;
          history = Array.isArray(d) ? d : (d && (d.transactions || d.history)) || [];
        }
        var error = !balanceData ? ((balanceResult && balanceResult.message) || "Could not load wallet balance.") : null;
        render(balanceData || {}, history, error);
      } catch (e) {
        render({}, [], "Something went wrong. Please try again.");
      }
    }

    load();
  })();
</script>
</body>
</html>
