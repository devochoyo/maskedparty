<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buy Coins — Masked Party</title>
<script src="/widgets/phosphor_icons.js"></script>
<script>PhosphorIcons.load();</script>
<style>
  :root{--primary-pink:#E91E63;--soft-pink:#FF6B8B;--light-pink:#FFE4EC;--bg:#F8F9FE;--text-dark:#1A1D2E;--text-medium:#6B7280;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text-dark);}

  header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid rgba(255,228,236,.4);}
  .head-row{max-width:560px;margin:0 auto;display:flex;align-items:center;padding:14px 16px;gap:12px;}
  .back-btn{width:34px;height:34px;border:none;background:none;font-size:18px;color:var(--text-dark);cursor:pointer;}
  h1{font-size:20px;font-weight:700;}

  main{max-width:560px;margin:0 auto;padding:20px;}
  .subtitle{font-size:13px;color:var(--text-medium);margin-bottom:16px;}

  .pkg-card{display:flex;align-items:center;gap:14px;background:#fff;border-radius:20px;border:1px solid rgba(255,228,236,.4);padding:18px;margin-bottom:14px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.03);}
  .pkg-card.best{border:2px solid var(--primary-pink);box-shadow:0 6px 16px rgba(233,30,99,.12);}
  .pkg-card:hover{transform:translateY(-1px);}
  .pkg-icon{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,rgba(233,30,99,.12),rgba(255,107,139,.06));border:1px solid rgba(233,30,99,.15);display:flex;align-items:center;justify-content:center;font-size:26px;flex:none;}
  .pkg-title-row{display:flex;align-items:center;gap:8px;}
  .pkg-coins{font-weight:700;font-size:16px;}
  .best-badge{padding:3px 8px;border-radius:8px;background:linear-gradient(135deg,var(--primary-pink),var(--soft-pink));color:#fff;font-size:10px;font-weight:700;}
  .pkg-name{margin-top:2px;font-size:12px;color:var(--text-medium);}
  .pkg-price{margin-left:auto;font-weight:700;font-size:16px;color:var(--primary-pink);flex:none;}
  .pkg-spin{width:20px;height:20px;border:2.5px solid rgba(233,30,99,.25);border-top-color:var(--primary-pink);border-radius:50%;animation:spin .8s linear infinite;flex:none;margin-left:auto;}
  @keyframes spin{to{transform:rotate(360deg)}}

  .state{display:flex;flex-direction:column;align-items:center;text-align:center;padding:60px 24px;}
  .state-icon-wrap{width:80px;height:80px;border-radius:50%;background:rgba(211,47,47,.08);display:flex;align-items:center;justify-content:center;font-size:36px;}
  .retry-btn{margin-top:20px;padding:10px 20px;border-radius:12px;border:none;background:var(--primary-pink);color:#fff;font-weight:700;font-size:14px;cursor:pointer;}
  .spinner-wrap{display:flex;justify-content:center;padding:80px 0;}
  .spinner{width:32px;height:32px;border:3px solid rgba(233,30,99,.2);border-top-color:var(--primary-pink);border-radius:50%;animation:spin .8s linear infinite;}

  .toast{position:fixed;left:16px;right:16px;bottom:24px;background:#D32F2F;color:#fff;padding:14px 16px;border-radius:12px;font-size:14px;text-align:center;max-width:420px;margin:0 auto;z-index:9800;}
</style>
</head>
<body>
  <header>
    <div class="head-row">
      <button class="back-btn" id="backBtn" aria-label="Back"><i class="ph ph-arrow-left"></i></button>
      <h1>Buy Coins</h1>
    </div>
  </header>
  <main>
    <p class="subtitle">Choose a coin package to top up your balance.</p>
    <div id="root"><div class="spinner-wrap"><div class="spinner" role="status" aria-label="Loading"></div></div></div>
  </main>

<script src="/services/api.js"></script>
<script src="/services/api_endpoints.js"></script>
<script src="/services/session_manager.js"></script>
<script src="/services/route_guard.js"></script>
<script>RouteGuard.require();</script>
<script>
  (function () {
    var root = document.getElementById("root");
    var payingPackageId = null;
    document.getElementById("backBtn").addEventListener("click", function () { window.history.back(); });

    function escapeHtml(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }
    function showToast(message) {
      var t = document.createElement("div");
      t.className = "toast";
      t.textContent = message;
      document.body.appendChild(t);
      setTimeout(function () { t.remove(); }, 3500);
    }

    function cardHtml(pkg) {
      var id = String(pkg.package_id);
      var best = pkg.is_best_value === true;
      var coins = pkg.coins || "0";
      var price = pkg.price || "0";
      var name = pkg.package_name || "";
      var isPaying = payingPackageId === id;

      return (
        '<div class="pkg-card' + (best ? " best" : "") + '" data-id="' + id + '">' +
        '<div class="pkg-icon"><i class="ph ph-coins"></i></div>' +
        '<div style="flex:1;min-width:0">' +
        '<div class="pkg-title-row"><div class="pkg-coins">' + escapeHtml(coins) + " coins</div>" +
        (best ? '<span class="best-badge">BEST VALUE</span>' : "") + "</div>" +
        (name ? '<div class="pkg-name">' + escapeHtml(name) + "</div>" : "") +
        "</div>" +
        (isPaying ? '<div class="pkg-spin"></div>' : '<div class="pkg-price">₤' + escapeHtml(price) + "</div>") +
        "</div>"
      );
    }

    function render(packages) {
      if (packages.length === 0) {
        root.innerHTML = '<div class="state"><div class="state-icon-wrap"><i class="ph ph-coins"></i></div><div style="margin-top:16px;font-weight:600">No packages available</div></div>';
        return;
      }
      root.innerHTML = packages.map(cardHtml).join("");
      root.querySelectorAll(".pkg-card").forEach(function (card) {
        card.addEventListener("click", function () {
          var pkg = packages.find(function (p) { return String(p.package_id) === card.getAttribute("data-id"); });
          if (pkg) buyPackage(pkg, packages);
        });
      });
    }

    function renderError(message) {
      root.innerHTML =
        '<div class="state"><div class="state-icon-wrap"><i class="ph ph-warning"></i></div>' +
        '<div style="margin-top:16px;font-weight:600">' + escapeHtml(message) + "</div>" +
        '<button class="retry-btn" id="retryBtn">Retry</button></div>';
      document.getElementById("retryBtn").addEventListener("click", load);
    }

    async function buyPackage(pkg, packages) {
      if (payingPackageId) return;
      var packageId = String(pkg.package_id);
      if (!packageId) { showToast("Invalid package"); return; }

      payingPackageId = packageId;
      render(packages);

      var token = SessionManager.getToken();
      try {
        var result = await ApiConfig.post(ApiEndpoints.paymentCreate, token, { package_id: parseInt(packageId, 10) || 0 });
        if (!result || result.success !== true) {
          payingPackageId = null;
          render(packages);
          showToast((result && result.message) || "Failed to start payment");
          return;
        }
        var data = result.data || {};
        var authorizationUrl = data.authorization_url;
        var reference = data.reference;
        if (!authorizationUrl || !reference) {
          payingPackageId = null;
          render(packages);
          showToast("Payment server error. Missing URL or reference.");
          return;
        }
        // Remember the reference so /payment/callback can verify it when
        // Flutterwave redirects back (works whether or not the backend
        // echoes tx_ref on the return URL).
        sessionStorage.setItem("mp_pending_payment_ref", reference);
        window.location.href = authorizationUrl;
      } catch (e) {
        payingPackageId = null;
        render(packages);
        showToast("Something went wrong. Please try again.");
      }
    }

    async function load() {
      root.innerHTML = '<div class="spinner-wrap"><div class="spinner" role="status" aria-label="Loading"></div></div>';
      var token = SessionManager.getToken();
      try {
        var result = await ApiConfig.get(ApiEndpoints.walletPackages, token);
        if (result && result.success === true) {
          var data = result.data;
          var packages = Array.isArray(data) ? data : (data && data.packages) || [];
          render(packages);
        } else {
          renderError((result && result.message) || "Could not load coin packages.");
        }
      } catch (e) {
        renderError("Something went wrong. Please try again.");
      }
    }

    load();
  })();
</script>
</body>
</html>
